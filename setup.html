<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Setup</title>
<style>
  :root { --bg:#f4f3ef; --panel:#fff; --ink:#1b1d21; --muted:#6b6f78; --line:#dddad2; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141518; --panel:#1d1f23; --ink:#ecebe7; --muted:#9a9ea8; --line:#2e3137; --accent:#f97316; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px; }
  label { display:block; font-weight:600; margin-top:14px; }
  input, textarea { width:100%; font:inherit; padding:8px; margin-top:4px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
  textarea { font-family:ui-monospace,monospace; font-size:12px; height:140px; }
  button { font:inherit; margin-top:14px; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  p { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Editor setup</h1>
  <p>Runs entirely in your browser. Encrypts your GitHub token with the editor password and produces <code>secret.json</code>. Commit that file to the repo root.</p>

  <label>GitHub fine-grained token</label>
  <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">

  <label>Editor password</label>
  <input id="pw" type="text" value="test123">

  <button id="go">Generate secret.json</button>

  <label>secret.json</label>
  <textarea id="out" readonly></textarea>
  <button id="dl" hidden>Download secret.json</button>
</div>
<script>
const b64 = u => btoa(String.fromCharCode(...u));
document.getElementById("go").onclick = async () => {
  const tok = document.getElementById("tok").value.trim();
  const pw  = document.getElementById("pw").value;
  if (!tok || !pw) return alert("Need both a token and a password.");
  const iterations = 600000;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key  = await crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt"]);
  const ct   = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(tok)));
  const json = JSON.stringify({ salt: b64(salt), iv: b64(iv), iterations, ct: b64(ct) }, null, 2) + "\n";
  document.getElementById("out").value = json;
  const dl = document.getElementById("dl");
  dl.hidden = false;
  dl.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = "secret.json"; a.click();
  };
};
</script>
</body>
</html>
