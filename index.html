  card.append(el("p", "card-label", nm && nm.date === ts ? "Meeting today" : "Next meeting"));
  if (nm) {
    const d = parseDate(nm.date);
    const big = el("div", "next-date");
    big.append(el("span", "nd-day", d.getDate()),
      el("span", "nd-rest", d.toLocaleDateString(undefined, { weekday: "long" }) + "\n" + d.toLocaleDateString(undefined, { month: "long" })));
    card.append(big);
    if (nm.note) card.append(el("p", "next-note", nm.note));
    const dls = deadlinesOn(nm.date);
    const act = activeOf(nm);
    const wks = workshopsOn(nm.date);
    if (dls.length || act.length || wks.length) {
      const bx = el("div", "next-boxes");
      wks.forEach(x => bx.append(wsbox(x)));
      dls.forEach(x => bx.append(dlbox(x)));
      act.forEach(id => bx.append(sbox(id)));
      card.append(bx);
    } else {
      card.append(el("p", "muted", "No subteams marked active yet."));
    }
    if (nm.agenda) {
      const lines = nm.agenda.split("\n").filter(Boolean);
      const ag = el("div", "next-agenda", lines.slice(0, 4).join("\n") + (lines.length > 4 ? "\n…" : ""));
      card.append(ag);
    }
    card.append(el("span", "card-go", "Open day"));
  } else {
    card.append(el("p", "next-none", "No meetings scheduled yet."));
    card.append(el("span", "card-go", "Open calendar"));
  }
  grid.append(card);

  // Right column: next event, your tasks, deadlines, this week
  const side = el("div", "home-side");

  const ev = nextEvent();
  if (ev) {
    const cd = countdown(ev);
    const ec = el("a", "card evcard"); ec.href = calHref("day", ev.start);
    ec.append(el("p", "card-label", "Next event"));
    const row = el("div", "ev-row");
    row.append(el("span", "ev-n", cd.n), el("span", "ev-unit", cd.unit));
    ec.append(row, el("div", "ev-name", ev.name || "Event"), el("div", "ev-meta", [eventDates(ev), ev.location].filter(Boolean).join(", ")));
    const tied = data.deadlines.filter(d => d.event === ev.id && d.date >= ts).length;
    if (tied) ec.append(el("div", "ev-dl", `${tied} deadline${tied === 1 ? "" : "s"} before it`));
    side.append(ec);
  }

  const yc = el("div", "card");
  const yl = el("a", "card-label link", "Your tasks"); yl.href = "#mine";
  yc.append(yl);
  if (!myName()) {
    const a = el("a", "muted", "Add your name to see your tasks"); a.href = "#mine"; yc.append(a);
  } else {
    const mine = sortTasks(myTasks().filter(t => !t.done));
    if (!mine.length) yc.append(el("p", "muted", "Nothing assigned to you."));
    mine.slice(0, 4).forEach(t => {
      const a = el("a", "my-line"); a.href = "#" + encodeURIComponent(t.team);
      a.onclick = () => { flashId = t.id; };
      const due = dueInfo(t);
      a.append(el("span", "my-t", t.title), el("span", "my-m" + (due.cls === "over" ? " bad" : ""), `${teamName(t.team)}${t.due ? `, ${due.text}` : ""}`));
      yc.append(a);
    });
    if (mine.length > 4) { const m = el("a", "my-more", `See all ${mine.length}`); m.href = "#mine"; yc.append(m); }
  }
  side.append(yc);

  const dc = el("div", "card");
  dc.append(el("p", "card-label", "Team deadlines"));
  const upD = data.deadlines.filter(d => d.date >= ts).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
  if (!upD.length) dc.append(el("p", "muted", "Nothing coming up."));
  upD.forEach(d => {
    const a = el("a", "dl-line"); a.href = calHref("day", d.date);
    const days = Math.round((parseDate(d.date) - t0) / 86400000);
    a.append(el("span", "dl-when", days === 0 ? "Today" : days === 1 ? "Tomorrow" : days < 7 ? `${days} days` : niceDate(d.date, { month: "short", day: "numeric" })),
      el("span", "dl-what", d.title + (d.event && eventName(d.event) ? ` (${eventName(d.event)})` : "")));
    dc.append(a);
  });
  side.append(dc);

  const wc = el("div", "card");
  const wl = el("a", "card-label link", "This week"); wl.href = calHref("week", ts);
  wc.append(wl);
  const strip = el("div", "strip");
  const ws = addDays(t0, -t0.getDay());
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), ds = iso(d), m = meetingOn(ds), dl = deadlinesOn(ds).length, wk = workshopsOn(ds).length;
    const c = el("a", "sday" + (ds === ts ? " today" : "") + (m ? " meet" : "") + (dl ? " dl" : "") + (wk ? " wsd" : ""));
    c.href = calHref("day", ds);
    c.title = d.toDateString() + (m ? ", meeting" : "") + (wk ? `, ${wk} workshop${wk === 1 ? "" : "s"}` : "") + (dl ? ", deadline" : "");
    c.append(el("span", "sd-dow", WEEKDAYS[d.getDay()][0]), el("span", "sd-num", d.getDate()));
    strip.append(c);
  }
  wc.append(strip);
  side.append(wc);
  grid.append(side);
  list.append(grid);

  // Subteams
  const sh = el("div", "home-h");
  sh.append(el("h3", "", "Subteams"));
  list.append(sh);
  const tg = el("div", "team-cards");
  data.teams.forEach(tm => {
    const mine = data.tasks.filter(t => t.team === tm.id);
    const op = mine.filter(t => !t.done);
    const high = op.filter(t => t.priority === "High").length;
    const od = op.filter(t => t.due && t.due < ts).length;
    const a = el("a", "tcard"); a.href = "#" + encodeURIComponent(tm.id);
    a.append(el("span", "tc-name", tm.name));
    const n = el("span", "tc-open"); n.append(el("b", "", op.length), document.createTextNode(op.length === 1 ? " open" : " open"));
    a.append(n);
    const meta = el("span", "tc-meta");
    const blk = op.filter(t => stOf(t) === "blocked").length;
    const waitOn = waitingOn(tm.id).length;
    const toOrder = tm.id === "inventory" ? allParts().filter(x => (x.pt.status || "need") === "need").length : 0;
    if (od) meta.append(el("span", "bad", `${od} overdue`));
    if (waitOn) meta.append(el("span", "bad", `${waitOn} waiting on them`));
    if (blk) meta.append(el("span", "", `${blk} blocked`));
    if (toOrder) meta.append(el("span", "bad", `${toOrder} part${toOrder === 1 ? "" : "s"} to order`));
    if (high) meta.append(el("span", "", `${high} high priority`));
    if (!meta.childNodes.length) meta.append(el("span", "", op.length ? "On track" : mine.length ? "All done" : "No tasks yet"));
    a.append(meta);
    const tr = el("span", "tc-track"); const f = el("span", "tc-fill");
    f.style.width = mine.length ? ((mine.length - op.length) / mine.length * 100) + "%" : "0";
    tr.append(f); a.append(tr);
    tg.append(a);
  });
  list.append(tg);
}

/* ---------- Calendar: month, week and day views ----------
   The view lives in the URL (#calendar/week/2026-10-22) so links and the back button work. */
function calState() {
  const [, v, d] = decodeURIComponent(location.hash.slice(1)).split("/");
  return {
    view: ["month", "week", "day"].includes(v) ? v : "month",
    date: /^\d{4}-\d{2}-\d{2}$/.test(d || "") && parseDate(d) ? d : iso(today())
  };
}
const calHref = (view, date) => `#calendar/${view}/${date}`;
const goCal = (view, date) => { location.hash = calHref(view, date); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const openCount = id => data.tasks.filter(t => t.team === id && !t.done).length;

// A subteam box: links to that subteam's to-do list
function sbox(id, cls = "") {
  const a = document.createElement("a");
  a.className = "sbox " + cls;
  a.href = "#" + encodeURIComponent(id);
  a.textContent = teamName(id);
  a.title = `Open ${teamName(id)} tasks`;
  a.onclick = e => e.stopPropagation();
  return a;
}
const activeOf = m => m ? (m.active || []).filter(id => data.teams.some(t => t.id === id) && inCal(id)) : [];

function renderCalendar() {
  const { view, date } = calState();
  const D = parseDate(date), t0 = iso(today());

  const head = div("page-head");
  const h2 = document.createElement("h2"); h2.className = "page-title"; h2.textContent = "Calendar";
  head.append(h2);
  $("pageHead").replaceChildren(head);

  const list = $("list");
  list.innerHTML = "";

  // Toolbar: previous / label / next, view switch, today
  const bar = div("cal-bar");
  const step = { month: d => new Date(d.getFullYear(), d.getMonth() + 1, 1), week: d => addDays(d, 7), day: d => addDays(d, 1) }[view];
  const back = { month: d => new Date(d.getFullYear(), d.getMonth() - 1, 1), week: d => addDays(d, -7), day: d => addDays(d, -1) }[view];
  const wkStart = addDays(D, -D.getDay()), wkEnd = addDays(wkStart, 6);
  const label = view === "month" ? D.toLocaleDateString(undefined, { month: "long", year: "numeric" })
    : view === "week" ? `${wkStart.toLocaleDateString(undefined, { month: "short", day: "numeric" })} to ${wkEnd.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`
    : D.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const prev = document.createElement("button"); prev.textContent = "‹"; prev.setAttribute("aria-label", "Previous");
  const next = document.createElement("button"); next.textContent = "›"; next.setAttribute("aria-label", "Next");
  prev.onclick = () => goCal(view, iso(back(D)));
  next.onclick = () => goCal(view, iso(step(D)));
  const seg = div("seg");
  ["month", "week", "day"].forEach(v => {
    const a = document.createElement("a");
    a.href = calHref(v, date); a.textContent = v[0].toUpperCase() + v.slice(1);
    if (v === view) a.setAttribute("aria-current", "true");
    seg.append(a);
  });
  const todayB = document.createElement("button"); todayB.textContent = "Today";
  todayB.onclick = () => goCal(view, t0);
  bar.append(prev, div("month", label), next, div("spacer"), seg, todayB);
  list.append(bar);

  if (view === "month") list.append(monthView(D, date, t0));
  else if (view === "week") list.append(weekView(wkStart, date, t0));
  else list.append(dayView(date, t0));
}

function monthView(D, sel, t0) {
  const y = D.getFullYear(), mo = D.getMonth();
  const first = new Date(y, mo, 1);
  const wrap = div("");
  const inMonth = data.meetings.filter(m => { const d = parseDate(m.date); return d.getFullYear() === y && d.getMonth() === mo; });
  wrap.append(div("muted cal-sub", inMonth.length
    ? `${inMonth.length} meeting${inMonth.length === 1 ? "" : "s"} this month. Tap a day to zoom into its week.`
    : "No meetings scheduled this month."));
  const grid = div("cal");
  WEEKDAYS.forEach(w => grid.append(div("dow", w)));
  const start = addDays(first, -first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, mo + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), ds = iso(d), m = meetingOn(ds), act = activeOf(m);
    const due = data.tasks.filter(t => t.due === ds && !t.done && inCal(t.team));
    const cell = div("day" + (d.getMonth() !== mo ? " out" : "") + (ds === t0 ? " today" : "") + (m ? " meet" : ""));
    cell.tabIndex = 0; cell.setAttribute("role", "link");
    cell.setAttribute("aria-label", `${d.toDateString()}${m ? ", meeting" : ""}. Open week`);
    cell.onclick = () => goCal("week", ds);
    cell.onkeydown = e => { if (e.key === "Enter") goCal("week", ds); };
    cell.append(div("num", d.getDate()));
    const evs = eventsOn(ds);
    if (evs.length) { const eb = div("boxes txt"); evs.forEach(e => eb.append(evbox(e))); cell.append(eb); cell.classList.add("has-ev"); }
    const wks = workshopsOn(ds);
    if (wks.length) { const wb = div("boxes txt"); wks.slice(0, 2).forEach(w => wb.append(wsbox(w))); if (wks.length > 2) wb.append(Object.assign(document.createElement("span"), { className: "muted small", textContent: `+${wks.length - 2} workshops` })); cell.append(wb); }
    const dls = deadlinesOn(ds);
    if (dls.length) { cell.classList.add("has-dl"); const db = div("boxes txt"); dls.forEach(d => db.append(dlbox(d))); cell.append(db); }
    if (m && !act.length) cell.append(div("m txt", "Meeting"));
    const boxes = div("boxes txt");
    act.slice(0, 3).forEach(id => boxes.append(sbox(id)));
    if (act.length > 3) {
      const more = document.createElement("a"); more.className = "sbox more"; more.href = calHref("day", ds);
      more.textContent = `+${act.length - 3} more`; more.onclick = e => e.stopPropagation();
      boxes.append(more);
    }
    if (act.length) cell.append(boxes);
    if (due.length) cell.append(div("due txt" + (ds < t0 ? " over" : ""), `${due.length} due`));
    grid.append(cell);
  }
  wrap.append(grid);
  return wrap;
}

function weekView(start, sel, t0) {
  const wrap = div("");
  wrap.append(div("muted cal-sub", "Tap a day to zoom in. Tap a subteam to open its to-do list."));
  const grid = div("week");
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), ds = iso(d), m = meetingOn(ds), act = activeOf(m);
    const due = sortTasks(data.tasks.filter(t => t.due === ds && !t.done && inCal(t.team)));
    const col = div("wk" + (ds === t0 ? " today" : "") + (m ? " meet" : "") + (ds === sel ? " sel" : ""));
    col.tabIndex = 0; col.setAttribute("role", "link");
    col.setAttribute("aria-label", `${d.toDateString()}. Open day`);
    col.onclick = () => goCal("day", ds);
    col.onkeydown = e => { if (e.key === "Enter") goCal("day", ds); };
    const hd = div("wk-head");
    hd.append(div("wk-dow", WEEKDAYS[d.getDay()]), div("wk-num", d.getDate()));
    col.append(hd);
    const evs = eventsOn(ds);
    if (evs.length) { const eb = div("boxes"); evs.forEach(e => eb.append(evbox(e))); col.append(eb); }
    const wks = workshopsOn(ds);
    if (wks.length) { const wb = div("boxes"); wks.forEach(w => { const b = wsbox(w); b.textContent = `${w.title || "Workshop"}${w.time ? `, ${w.time}` : ""}`; b.append(Object.assign(document.createElement("small"), { textContent: teamName(w.team) })); wb.append(b); }); col.append(wb); }
    const dls = deadlinesOn(ds);
    if (dls.length) { const db = div("boxes"); dls.forEach(d => db.append(dlbox(d))); col.append(db); }
    if (m) {
      col.append(div("wk-note", m.note || "Meeting"));
      const boxes = div("boxes");
      act.forEach(id => boxes.append(sbox(id)));
      if (!act.length) boxes.append(div("muted small", "No subteams yet"));
      col.append(boxes);
    } else {
      col.append(div("muted small", "No meeting"));
    }
    if (due.length) {
      const dl = div("wk-due");
      due.forEach(t => {
        const a = document.createElement("a"); a.href = "#" + encodeURIComponent(t.team);
        a.textContent = t.title; a.onclick = e => e.stopPropagation();
        a.className = ds < t0 ? "over" : "";
        dl.append(a);
      });
      col.append(dl);
    }
    grid.append(col);
  }
  wrap.append(grid);
  return wrap;
}

function dayView(ds, t0) {
  const box = div("detail");
  const m = meetingOn(ds);
  const act = activeOf(m);

  eventsOn(ds).forEach(e => {
    const b = div("ev-banner");
    const total = Math.round((parseDate(e.end || e.start) - parseDate(e.start)) / 86400000) + 1;
    const day = Math.round((parseDate(ds) - parseDate(e.start)) / 86400000) + 1;
    b.append(Object.assign(document.createElement("small"), { textContent: total > 1 ? `Event, day ${day} of ${total}` : "Event" }),
      Object.assign(document.createElement("strong"), { textContent: e.name || "Event" }));
    if (e.location) b.append(Object.assign(document.createElement("span"), { textContent: e.location }));
    box.append(b);
  });

  const wks = workshopsOn(ds);
  if (wks.length) {
    const wb = div("boxes lg ws-row");
    wks.forEach(w => { const a = wsbox(w, "lg"); a.href = "#" + encodeURIComponent(w.team); a.title = `Open ${teamName(w.team)}`; wb.append(a); });
    box.append(wb);
  }

  const dls = deadlinesOn(ds);
  if (dls.length) {
    const db = div("boxes lg dl-row");
    dls.forEach(d => { const a = dlbox(d, "lg"); const sm = document.createElement("small"); sm.textContent = d.event && eventName(d.event) ? `Team deadline for ${eventName(d.event)}` : "Team deadline"; a.prepend(sm); db.append(a); });
    box.append(db);
  }

  if (m) {
    const note = div("note", m.note || "Meeting");
    makeEditable(note, v => m.note = v);
    box.append(note);

    if (m.agenda || editing) {
      const ha = document.createElement("h4"); ha.textContent = "Agenda";
      const ag = div("agenda", m.agenda || "");
      if (editing) ag.dataset.placeholder = "Paste the agenda here";
      if (editing) {
        // Plain text only, and keep line breaks (Enter adds a line here)
        ag.contentEditable = "plaintext-only";
        if (ag.contentEditable !== "plaintext-only") ag.contentEditable = "true";
        ag.oninput = () => { m.agenda = ag.innerText.replace(/\n{3,}/g, "\n\n").trim(); markDirty(); };
      }
      box.append(ha, ag);
    }

    const h4 = document.createElement("h4"); h4.textContent = "Active subteams";
    box.append(h4);
    const boxes = div("boxes lg");
    act.forEach(id => {
      const a = sbox(id, "lg");
      const n = openCount(id);
      const sm = document.createElement("small"); sm.textContent = n ? `${n} open` : "Nothing open";
      a.append(sm);
      boxes.append(a);
    });
    if (!act.length) boxes.append(div("muted", "No subteams have marked themselves active yet."));
    box.append(boxes);

    if (editing) {
      const h5 = document.createElement("h4"); h5.textContent = "Mark subteams active (tap to toggle)";
      const g = div("teams-grid");
      const active = m.active || (m.active = []);
      data.teams.filter(t => t.calendar !== false).forEach(t => {
        const b = document.createElement("button");
        const on = active.includes(t.id);
        b.className = "tchip" + (on ? " on" : "");
        b.textContent = t.name;
        b.setAttribute("aria-pressed", on);
        b.onclick = () => {
          const i = active.indexOf(t.id);
          i >= 0 ? active.splice(i, 1) : active.push(t.id);
          active.sort((a, b) => data.teams.findIndex(x => x.id === a) - data.teams.findIndex(x => x.id === b));
          markDirty(); render();
        };
        g.append(b);
      });
      box.append(h5, g);
    }
  } else {
    box.append(div("muted", "No meeting scheduled."));
    if (editing) {
      const add = document.createElement("button"); add.className = "tbtn"; add.textContent = "Add a meeting on this day";
      add.style.marginTop = "10px";
      add.onclick = () => { addMeeting(ds, ""); markDirty(); render(); };
      box.append(add);
    }
  }

  const due = sortTasks(data.tasks.filter(t => t.due === ds && !t.done && inCal(t.team)));
  if (due.length) {
    const h4 = document.createElement("h4"); h4.textContent = "Tasks due";
    const dl = div("due-list");
    due.forEach(t => {
      const row = document.createElement("div");
      const a = document.createElement("a"); a.href = "#" + encodeURIComponent(t.team); a.textContent = t.title;
      row.append(a, ` (${teamName(t.team)})`);
      dl.append(row);
    });
    box.append(h4, dl);
  }
  const wrap = div("");
  wrap.append(box);
  return wrap;
}

/* ---------- Captain stuff (edit mode only): deadlines and meetings ---------- */
function addMeeting(date, note, agenda) {
  if (!date || meetingOn(date)) return false;
  data.meetings.push({ date, note: note || "", agenda: agenda || "", active: [] });
  data.meetings.sort((a, b) => a.date.localeCompare(b.date));
  return true;
}

function section(title) {
  const sec = div("section");
  const h = document.createElement("h3"); h.className = "sec-title"; h.textContent = title;
  sec.append(h);
  return sec;
}

function renderCaptain() {
  const head = div("page-head");
  const h2 = document.createElement("h2"); h2.className = "page-title"; h2.textContent = "Captain stuff";
  const sub = div("muted", "Only shown while editing. Past meetings and deadlines drop off this page but stay on the calendar.");
  sub.style.marginTop = "8px";
  head.append(h2, sub);
  $("pageHead").replaceChildren(head);

  const list = $("list");
  list.innerHTML = "";
  const t = iso(today());

  // Team-wide deadlines
  // Competitions and events
  const esec = section("Competitions and events");
  const er = div("form-row");
  er.innerHTML = `<label class="grow">Event<input type="text" id="eName" placeholder="e.g. Humber District Event"></label>
    <label>Starts<input type="date" id="eStart"></label>
    <label>Ends<input type="date" id="eEnd"></label>
    <label>Where<input type="text" id="eLoc" placeholder="e.g. Humber Polytechnic"></label>
    <button class="tbtn go" id="eAdd">Add event</button>`;
  esec.append(er);
  const el2 = div("mlist");
  const upE = data.events.filter(e => (e.end || e.start) >= t).sort((a, b) => a.start.localeCompare(b.start));
  if (!upE.length) el2.append(div("muted", "No upcoming events."));
  upE.forEach(e => {
    const r = div("mrow ev");
    const name = div("note-cell", e.name);
    makeEditable(name, v => e.name = v);
    const loc = document.createElement("input"); loc.type = "text"; loc.value = e.location || ""; loc.placeholder = "Where"; loc.className = "ev-loc";
    loc.oninput = () => { e.location = loc.value.trim(); markDirty(); };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Remove event");
    del.onclick = () => {
      const tied = data.deadlines.filter(d => d.event === e.id);
      if (!confirm(`Remove ${e.name}?${tied.length ? ` Its ${tied.length} deadline${tied.length === 1 ? "" : "s"} stay, just no longer tied to it.` : ""}`)) return;
      tied.forEach(d => delete d.event);
      data.events.splice(data.events.indexOf(e), 1); markDirty(); render();
    };
    const cd = countdown(e);
    r.append(div("d", eventDates(e)), name, loc, div("c", cd.text), del);
    el2.append(r);
  });
  esec.append(el2);

  const dsec = section("Team deadlines");
  const dr = div("form-row");
  dr.innerHTML = `<label>Date<input type="date" id="dDate"></label>
    <label class="grow">Deadline<input type="text" id="dTitle" placeholder="e.g. Robot bagged and tagged"></label>
    <label>For event (optional)<select id="dEvent"><option value="">None</option></select></label>
    <button class="tbtn go" id="dAdd">Add deadline</button>`;
  upE.forEach(e => dr.querySelector("#dEvent").add(new Option(e.name, e.id)));
  dsec.append(dr);
  const dl = div("mlist");
  const upcomingD = data.deadlines.filter(d => d.date >= t).sort((a, b) => a.date.localeCompare(b.date));
  if (!upcomingD.length) dl.append(div("muted", "No upcoming deadlines."));
  upcomingD.forEach(d => {
    const r = div("mrow dl");
    const title = div("note-cell", d.title);
    makeEditable(title, v => d.title = v);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Remove deadline");
    del.onclick = () => { data.deadlines.splice(data.deadlines.indexOf(d), 1); markDirty(); render(); };
    r.append(div("d", niceDate(d.date, { weekday: "short", month: "short", day: "numeric" })), title, div("c", d.event ? eventName(d.event) : ""), del);
    dl.append(r);
  });
  dsec.append(dl);

  // Add a meeting, with an optional agenda
  const msec = section("Add a meeting");
  const mr = div("form-row");
  mr.innerHTML = `<label>Date<input type="date" id="mDate"></label>
    <label>Time or note<input type="text" id="mNote" placeholder="e.g. 3:30 to 6 pm"></label>`;
  const ag = document.createElement("label"); ag.className = "agenda-in";
  ag.innerHTML = `Agenda (optional)<textarea id="mAgenda" rows="5" placeholder="Paste the team agenda for this meeting"></textarea>`;
  const mb = div("form-row");
  mb.innerHTML = `<button class="tbtn go" id="mAdd">Add meeting</button>`;
  msec.append(mr, ag, mb);

  // Weekly schedule
  const rsec = section("Add a weekly schedule");
  const r2 = div("form-row");
  r2.innerHTML = `<label>From<input type="date" id="rFrom"></label>
    <label>To<input type="date" id="rTo"></label>
    <label>Time or note<input type="text" id="rNote" placeholder="e.g. 3:30 to 6 pm"></label>`;
  const wd = div("wd");
  WEEKDAYS.forEach((w, i) => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" value="${i}"> ${w}`;
    wd.append(l);
  });
  const r3 = div("form-row"); r3.style.marginTop = "8px";
  const addRep = document.createElement("button"); addRep.className = "tbtn go"; addRep.textContent = "Add meetings";
  r3.append(wd, addRep);
  rsec.append(r2, r3);

  // Upcoming meetings (past ones drop off)
  const usec = section("Upcoming meetings");
  const ml = div("mlist");
  const upcoming = data.meetings.filter(m => m.date >= t);
  if (!upcoming.length) ml.append(div("muted", "No upcoming meetings."));
  upcoming.forEach(m => ml.append(meetingRow(m)));
  usec.append(ml);

  list.append(esec, dsec, msec, rsec, usec);
  $("eAdd").onclick = () => {
    const name = $("eName").value.trim(), start = $("eStart").value, end = $("eEnd").value;
    if (!name || !start) return setStatus("Give the event a name and a start date.", "err");
    if (end && end < start) return setStatus("The end date is before the start date.", "err");
    data.events.push({ id: newId(), name, start, end: end && end !== start ? end : "", location: $("eLoc").value.trim() });
    markDirty(); render(); setStatus(`Added ${name}. Save to publish it.`);
  };
  $("dAdd").onclick = () => {
    const d = $("dDate").value, title = $("dTitle").value.trim();
    if (!d || !title) return setStatus("Give the deadline a date and a name.", "err");
    const ev = $("dEvent").value;
    data.deadlines.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), date: d, title, ...(ev ? { event: ev } : {}) });
    markDirty(); render(); setStatus(`Added deadline for ${niceDate(d)}. Save to publish it.`);
  };
  $("mAdd").onclick = () => {
    const d = $("mDate").value;
    if (!d) return setStatus("Pick a date first.", "err");
    if (!addMeeting(d, $("mNote").value.trim(), $("mAgenda").value.trim())) return setStatus("There's already a meeting on that date. Edit its agenda below.", "err");
    markDirty(); render(); setStatus(`Added ${niceDate(d)}. Save to publish it.`);
  };
  addRep.onclick = () => {
    const from = parseDate($("rFrom").value), to = parseDate($("rTo").value);
    const days = [...wd.querySelectorAll("input:checked")].map(i => +i.value);
    if (!from || !to || to < from) return setStatus("Pick a start date and a later end date.", "err");
    if (!days.length) return setStatus("Pick at least one weekday.", "err");
    if ((to - from) / 86400000 > 366) return setStatus("Keep the range to a year or less.", "err");
    let n = 0;
    for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1))
      if (days.includes(d.getDay()) && addMeeting(iso(d), $("rNote").value.trim(), "")) n++;
    markDirty(); render();
    setStatus(n ? `Added ${n} meeting${n === 1 ? "" : "s"}. Save to publish them.` : "No new dates. They were already scheduled.");
  };
}

function meetingRow(m) {
  const wrap = div("mwrap");
  const r = div("mrow");
  const d = document.createElement("a"); d.className = "d"; d.href = calHref("day", m.date);
  d.textContent = niceDate(m.date, { weekday: "short", month: "short", day: "numeric" });
  const note = div("note-cell", m.note || "");
  makeEditable(note, v => m.note = v);
  const n = (m.active || []).length;
  const agBtn = document.createElement("button"); agBtn.className = "tbtn small";
  agBtn.textContent = m.agenda ? "Edit agenda" : "Add agenda";
  const del = document.createElement("button");
  del.className = "del"; del.textContent = "×"; del.title = "Remove meeting"; del.setAttribute("aria-label", "Remove meeting");
  del.onclick = () => {
    if (n && !confirm(`${n} subteam${n === 1 ? " has" : "s have"} marked this meeting active. Remove it anyway?`)) return;
    data.meetings.splice(data.meetings.indexOf(m), 1); markDirty(); render();
  };
  r.append(d, note, agBtn, del);
  wrap.append(r);

  const ta = document.createElement("textarea");
  ta.className = "agenda-edit"; ta.rows = 6; ta.value = m.agenda || "";
  ta.placeholder = "Paste the team agenda for this meeting";
  ta.hidden = !m.agenda;
  ta.oninput = () => { m.agenda = ta.value; agBtn.textContent = ta.value.trim() ? "Edit agenda" : "Add agenda"; markDirty(); };
  agBtn.onclick = () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); };
  wrap.append(ta);
  return wrap;
}

function taskEl(t) {
  const st = stOf(t);
  const el = document.createElement("div");
  el.className = `task p-${t.priority} s-${st}` + (t.done ? " done" : "");
  el.dataset.id = t.id;

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.className = "check"; cb.checked = !!t.done; cb.disabled = !editing;
  cb.setAttribute("aria-label", "Done");
  cb.onchange = () => { setSt(t, cb.checked ? "done" : "todo"); markDirty(); render(); };

  const mid = document.createElement("div");
  const title = div("title", t.title);
  makeEditable(title, v => t.title = v);

  const meta = div("meta");
  if (editing) {
    const teamSel = document.createElement("select");
    teamSel.setAttribute("aria-label", "Subteam");
    data.teams.forEach(x => teamSel.add(new Option(x.name, x.id, false, x.id === t.team)));
    teamSel.onchange = () => {
      t.team = teamSel.value;
      const cats = teamOf(t).categories || [];
      if (!cats.includes(t.subsystem)) t.subsystem = cats.includes("Other") ? "Other" : (cats[0] || "");
      if (t.blockedBy === t.team) delete t.blockedBy;
      markDirty(); render();
    };
    const stSel = document.createElement("select");
    stSel.setAttribute("aria-label", "Status"); stSel.className = "st-sel";
    const depBlocked = !t.done && openDeps(t).length > 0;
    STATUSES.forEach(([v, l]) => stSel.add(new Option(l, v, false, v === (depBlocked ? "blocked" : ownSt(t)))));
    if (depBlocked) { stSel.disabled = true; stSel.title = "Blocked until the tasks it depends on are done. Tick the box to mark it done anyway."; }
    stSel.onchange = () => { setSt(t, stSel.value); markDirty(); render(); };
    const need = document.createElement("select");
    need.setAttribute("aria-label", "Members needed"); need.className = "need-sel";
    need.add(new Option("Members needed", "0", false, !t.needed));
    for (let i = 1; i <= 12; i++) need.add(new Option(`${i} member${i === 1 ? "" : "s"} needed`, String(i), false, t.needed === i));
    need.onchange = () => {
      const n = +need.value;
      if (n) { t.needed = n; t.filled = Math.min(t.filled || 0, n); } else { delete t.needed; delete t.filled; }
      markDirty(); render();
    };
    meta.append(
      stSel,
      field("Owner", t.owner, v => t.owner = v),
      teamSel,
      selectField(t.subsystem, teamOf(t).categories || [], v => { t.subsystem = v; }),
      dateField(t.due, v => t.due = v),
      need
    );
  } else {
    if (st === "doing" || st === "blocked") meta.append(Object.assign(document.createElement("span"), { className: "stp stp-" + st, textContent: ST_LABEL[st] }));
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = t.subsystem;
    const who = document.createElement("span"); who.innerHTML = "<b></b>";
    who.firstChild.textContent = t.owner || "Unassigned";
    const due = dueInfo(t);
    const ds = document.createElement("span"); ds.className = "due " + due.cls; ds.textContent = due.text;
    meta.append(tag, who, ds);
  }
  mid.append(title, meta);
  if (t.needed) mid.append(slotsEl(t));

  // Waiting on unfinished dependencies
  const od = t.done ? [] : openDeps(t);
  if (od.length && !editing) {
    const bl = div("blocked");
    const line = document.createElement("span");
    line.append(Object.assign(document.createElement("b"), { textContent: "Waiting on " }));
    od.forEach((d, i) => { if (i) line.append(", "); line.append(taskLink(d)); if (d.team !== t.team) line.append(` (${teamName(d.team)})`); });
    bl.append(line);
    mid.append(bl);
  }

  // Blocked by hand: what it's waiting on
  if (!t.done && ownSt(t) === "blocked") {
    const bl = div("blocked");
    if (editing) {
      const lab = document.createElement("span"); lab.textContent = "Waiting on";
      const sel = document.createElement("select"); sel.setAttribute("aria-label", "Waiting on");
      sel.add(new Option("Something else", "", false, !t.blockedBy));
      data.teams.filter(x => x.id !== t.team).forEach(x => sel.add(new Option(x.name, x.id, false, x.id === t.blockedBy)));
      sel.onchange = () => { sel.value ? t.blockedBy = sel.value : delete t.blockedBy; markDirty(); };
      const note = document.createElement("input"); note.type = "text"; note.value = t.blockedNote || "";
      note.placeholder = "What exactly? e.g. CAD for the bumper brackets"; note.className = "bl-note";
      note.oninput = () => { t.blockedNote = note.value; markDirty(); };
      bl.append(lab, sel, note);
    } else {
      const line = document.createElement("span");
      const strong = document.createElement("b");
      strong.textContent = t.blockedBy ? `Waiting on ${teamName(t.blockedBy)}` : "Blocked";
      line.append(strong);
      if (t.blockedNote) line.append(": " + t.blockedNote);
      bl.append(line);
    }
    mid.append(bl);
  }

  // Dependencies editor (edit mode) and what this task is holding up (view mode)
  if (editing) mid.append(depsEditor(t));
  const holds = t.done ? [] : data.tasks.filter(x => !x.done && (x.dependsOn || []).includes(t.id));
  if (holds.length && !editing) {
    const hl = div("holds");
    hl.append(Object.assign(document.createElement("b"), { textContent: "Holding up " }));
    holds.forEach((d, i) => { if (i) hl.append(", "); hl.append(taskLink(d)); if (d.team !== t.team) hl.append(` (${teamName(d.team)})`); });
    mid.append(hl);
  }

  const notes = div("notes", t.notes || "");
  makeEditable(notes, v => t.notes = v);
  if (!editing && !t.notes) notes.hidden = true;
  mid.append(notes);
  if (editing || (t.parts && t.parts.length)) mid.append(partsEl(t));

  const right = div("right");
  if (editing) {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Priority");
    PRIORITIES.forEach(p => sel.add(new Option(p, p, false, p === t.priority)));
    sel.onchange = () => { t.priority = sel.value; markDirty(); render(); };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.title = "Delete task"; del.setAttribute("aria-label", "Delete task");
    del.onclick = () => { data.tasks.splice(data.tasks.indexOf(t), 1); markDirty(); render(); };
    right.append(sel, del);
  } else {
    const p = document.createElement("span");
    p.className = "pri"; p.textContent = t.priority;
    right.append(p);
  }

  el.append(cb, mid, right);
  return el;
}

/* ---------- Dependencies editor ---------- */
function depsEditor(t) {
  const box = div("deps");
  box.append(Object.assign(document.createElement("span"), { className: "deps-lab", textContent: "Depends on" }));
  (t.dependsOn || []).forEach(id => {
    const d = data.tasks.find(x => x.id === id);
    if (!d) return;
    const chip = div("dep-chip" + (d.done ? " done" : ""));
    chip.append(Object.assign(document.createElement("span"), { textContent: `${d.title}${d.team !== t.team ? ` (${teamName(d.team)})` : ""}${d.done ? ", done" : ""}` }));
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", `Remove dependency on ${d.title}`);
    x.onclick = () => { t.dependsOn = t.dependsOn.filter(i => i !== id); if (!t.dependsOn.length) delete t.dependsOn; markDirty(); render(); };
    chip.append(x);
    box.append(chip);
  });
  // Any unfinished task that isn't this one, isn't already listed, and wouldn't create a loop
  const options = data.tasks.filter(d => d.id !== t.id && !d.done && !(t.dependsOn || []).includes(d.id) && !dependsOnTask(d, t.id));
  if (options.length) {
    const sel = document.createElement("select"); sel.className = "dep-add"; sel.setAttribute("aria-label", "Add a dependency");
    sel.add(new Option(t.dependsOn && t.dependsOn.length ? "Add another task" : "Add a task it depends on", ""));
    data.teams.forEach(tm => {
      const mine = sortTasks(options.filter(d => d.team === tm.id));
      if (!mine.length) return;
      const g = document.createElement("optgroup"); g.label = tm.name;
      mine.forEach(d => g.append(new Option(d.title, d.id)));
      sel.append(g);
    });
    sel.onchange = () => {
      if (!sel.value) return;
      t.dependsOn = [...(t.dependsOn || []), sel.value];
      markDirty(); render();
    };
    box.append(sel);
  } else if (!(t.dependsOn || []).length) box.append(Object.assign(document.createElement("span"), { className: "muted small", textContent: "No other open tasks to depend on." }));
  return box;
}

/* ---------- Members needed: one box per slot, red once every slot is filled ---------- */
function slotsEl(t) {
  const n = t.needed, f = Math.min(t.filled || 0, n), full = f >= n;
  const box = div("slots" + (full ? " full" : ""));
  const boxes = div("slot-boxes");
  for (let i = 0; i < n; i++) {
    const b = document.createElement(editing ? "button" : "span");
    b.className = "slot" + (i < f ? " on" : "");
    if (editing) {
      b.type = "button";
      b.setAttribute("aria-label", `Slot ${i + 1} of ${n}, ${i < f ? "filled" : "open"}`);
      b.onclick = () => { t.filled = i < f ? i : i + 1; markDirty(); render(); };
    }
    boxes.append(b);
  }
  const left = n - f;
  box.append(boxes, Object.assign(document.createElement("span"), {
    className: "slot-text",
    textContent: full ? `Full (${n} of ${n})` : `${f} of ${n} members. Needs ${left} more`
  }));
  return box;
}

/* ---------- Parts on a task ---------- */
function partLink(pt) {
  const n = document.createElement(pt.link ? "a" : "span");
  n.className = "pt-name";
  n.textContent = `${pt.qty > 1 ? pt.qty + " × " : ""}${pt.name || "Unnamed part"}`;
  if (pt.link) { n.href = pt.link; n.target = "_blank"; n.rel = "noopener"; }
  return n;
}

function partsEl(t) {
  const box = div("parts");
  if (!editing) {
    t.parts.forEach(pt => {
      const r = div("pt-row");
      r.append(Object.assign(document.createElement("span"), { className: "pt pt-" + (pt.status || "need"), textContent: PART_LABEL[pt.status || "need"] }), partLink(pt));
      box.append(r);
    });
    return box;
  }
  if (t.parts.length) box.append(div("pt-head", "Parts"));
  t.parts.forEach(pt => {
    const r = div("pt-edit");
    const name = document.createElement("input"); name.type = "text"; name.value = pt.name || ""; name.placeholder = "Part name";
    name.setAttribute("aria-label", "Part name"); name.className = "pt-in-name";
    name.oninput = () => { pt.name = name.value; markDirty(); };
    const qty = document.createElement("input"); qty.type = "number"; qty.min = "1"; qty.value = pt.qty || 1;
    qty.setAttribute("aria-label", "Quantity"); qty.className = "pt-in-qty";
    qty.oninput = () => { pt.qty = Math.max(1, parseInt(qty.value) || 1); markDirty(); };
    const sel = document.createElement("select"); sel.setAttribute("aria-label", "Part status");
    PART_ST.forEach(([v, l]) => sel.add(new Option(l, v, false, v === (pt.status || "need"))));
    sel.onchange = () => { pt.status = sel.value; markDirty(); };
    const link = document.createElement("input"); link.type = "url"; link.value = pt.link || ""; link.placeholder = "Link (optional)";
    link.setAttribute("aria-label", "Link"); link.className = "pt-in-link";
    link.oninput = () => { pt.link = link.value.trim(); markDirty(); };
    const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Remove part");
    del.onclick = () => { t.parts.splice(t.parts.indexOf(pt), 1); markDirty(); render(); };
    r.append(name, qty, sel, link, del);
    box.append(r);
  });
  const add = document.createElement("button"); add.className = "pt-add"; add.textContent = "Add part";
  add.onclick = () => {
    t.parts.push({ id: newId(), name: "", qty: 1, status: "need", link: "" });
    markDirty(); render();
    const rows = document.querySelectorAll(`[data-id="${CSS.escape(t.id)}"] .pt-in-name`);
    rows.length && rows[rows.length - 1].focus();
  };
  box.append(add);
  return box;
}

/* ---------- Orders: every part on every open task, for Inventory & Logistics ---------- */
function allParts() {
  const out = [];
  data.tasks.filter(t => !t.done).forEach(t => (t.parts || []).forEach(pt => out.push({ pt, t })));
  return out;
}

function ordersEl() {
  const box = div("orders");
  const items = allParts();
  const by = st => items.filter(x => (x.pt.status || "need") === st);
  const need = by("need"), ord = by("ordered"), arr = by("arrived");
  const head = div("orders-head");
  head.append(Object.assign(document.createElement("h3"), { className: "sec-title", textContent: "Orders" }));
  if (need.length) {
    const copy = document.createElement("button"); copy.className = "tbtn small"; copy.textContent = "Copy to-order list";
    copy.onclick = async () => {
      const txt = need.map(({ pt, t }) => `${pt.qty || 1} × ${pt.name || "Unnamed part"}${pt.link ? " " + pt.link : ""} (for ${t.title}, ${teamName(t.team)})`).join("\n");
      try { await navigator.clipboard.writeText(txt); setStatus(`Copied ${need.length} part${need.length === 1 ? "" : "s"} to the clipboard.`, "ok"); }
      catch { setStatus("Couldn't copy. Select the list and copy it by hand.", "err"); }
    };
    head.append(copy);
  }
  box.append(head);
  if (!items.length) { box.append(div("muted", "No parts listed on any open task. Parts added to tasks on any subteam page show up here.")); return box; }

  const group = (label, rows, open) => {
    const d = document.createElement("details"); d.open = open;
    const sm = document.createElement("summary"); sm.textContent = `${label} (${rows.length})`;
    d.append(sm);
    if (!rows.length) d.append(div("muted small", "None."));
    rows.forEach(({ pt, t }) => {
      const r = div("ord-row");
      const what = div("ord-what"); what.append(partLink(pt));
      const forT = document.createElement("a"); forT.className = "ord-for"; forT.href = "#" + encodeURIComponent(t.team);
      forT.textContent = `${t.title} (${teamName(t.team)})`;
      r.append(what, forT);
      if (editing) {
        const sel = document.createElement("select"); sel.setAttribute("aria-label", "Part status");
        PART_ST.forEach(([v, l]) => sel.add(new Option(l, v, false, v === (pt.status || "need"))));
        sel.onchange = () => { pt.status = sel.value; markDirty(); render(); };
        r.append(sel);
      }
      d.append(r);
    });
    return d;
  };
  box.append(group("To order", need, true), group("Ordered, not arrived", ord, true), group("Arrived", arr, false));
  return box;
}

/* ---------- Workshops a subteam schedules (shown at the top of calendar days) ---------- */
function workshopsEl(team) {
  const ts = iso(today());
  const up = data.workshops.filter(w => w.team === team.id && w.date >= ts).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  if (!up.length && !editing) return null;
  const box = div("workshops");
  box.append(Object.assign(document.createElement("h3"), { className: "sec-title", textContent: "Workshops" }));
  if (!up.length) box.append(div("muted", "None scheduled."));
  up.forEach(w => {
    const r = div("ws-row");
    const when = document.createElement("a"); when.className = "ws-when"; when.href = calHref("day", w.date);
    when.textContent = niceDate(w.date, { weekday: "short", month: "short", day: "numeric" });
    const title = div("ws-t", w.title || "");
    makeEditable(title, v => w.title = v);
    const meta = div("ws-m", [w.time, w.where].filter(Boolean).join(", "));
    if (editing) {
      meta.textContent = "";
      const tm = document.createElement("input"); tm.type = "text"; tm.value = w.time || ""; tm.placeholder = "Time"; tm.setAttribute("aria-label", "Workshop time");
      tm.oninput = () => { w.time = tm.value.trim(); markDirty(); };
      const wh = document.createElement("input"); wh.type = "text"; wh.value = w.where || ""; wh.placeholder = "Where"; wh.setAttribute("aria-label", "Workshop location");
      wh.oninput = () => { w.where = wh.value.trim(); markDirty(); };
      meta.append(tm, wh);
    }
    r.append(when, title, meta);
    if (editing) {
      const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Cancel workshop");
      del.onclick = () => { data.workshops.splice(data.workshops.indexOf(w), 1); markDirty(); render(); };
      r.append(del);
    }
    if (w.notes || editing) {
      const n = div("ws-n", w.notes || "");
      if (editing) n.dataset.placeholder = "Notes (what to bring, who it's for)";
      makeEditable(n, v => w.notes = v);
      r.append(n);
    }
    box.append(r);
  });
  if (editing) {
    const f = div("form-row ws-form");
    f.innerHTML = `<label class="grow">Workshop<input type="text" class="wsT" placeholder="e.g. Lathe safety and certification"></label>
      <label>Date<input type="date" class="wsD"></label>
      <label>Time<input type="text" class="wsTm" placeholder="e.g. 4 to 5 pm"></label>
      <label>Where<input type="text" class="wsW" placeholder="e.g. Shop"></label>
      <button class="tbtn go wsAdd">Schedule</button>`;
    f.querySelector(".wsAdd").onclick = () => {
      const title = f.querySelector(".wsT").value.trim(), date = f.querySelector(".wsD").value;
      if (!title || !date) return setStatus("Give the workshop a name and a date.", "err");
      data.workshops.push({ id: newId(), team: team.id, date, title, time: f.querySelector(".wsTm").value.trim(), where: f.querySelector(".wsW").value.trim(), notes: "" });
      markDirty(); render(); setStatus(`Scheduled ${title} for ${niceDate(date)}. Save to publish it.`);
    };
    box.append(f);
  }
  return box;
}

/* ---------- Other subteams waiting on this one ---------- */
function waitingEl(team) {
  const w = waitingOn(team.id);
  if (!w.length) return null;
  const box = div("waiting");
  box.append(Object.assign(document.createElement("h3"), { className: "sec-title", textContent: `Waiting on ${team.name} (${w.length})` }));
  w.sort((x, y) => sortTasks([x.t, y.t])[0] === x.t ? -1 : 1).forEach(({ t, why }) => {
    const r = div("wait-row");
    r.append(Object.assign(document.createElement("span"), { className: "tag", textContent: teamName(t.team) }), taskLink(t));
    if (why) r.append(Object.assign(document.createElement("span"), { className: "muted", textContent: why }));
    box.append(r);
  });
  return box;
}

function div(cls, text) { const d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }

function field(label, val, set) {
  const s = document.createElement("span");
  const b = document.createElement("b"); b.textContent = val || "";
  b.dataset.placeholder = "Unassigned";
  makeEditable(b, v => set(v));
  s.append(label + " ", b);
  return s;
}

function selectField(val, opts, set) {
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", "Category");
  const all = opts.includes(val) || !val ? opts : [val, ...opts];
  all.forEach(o => sel.add(new Option(o, o, false, o === val)));
  sel.onchange = () => { set(sel.value); markDirty(); };
  return sel;
}

function dateField(val, set) {
  const inp = document.createElement("input"); inp.type = "date"; inp.value = val || "";
  inp.setAttribute("aria-label", "Due date");
  inp.onchange = () => { set(inp.value); markDirty(); };
  return inp;
}

function makeEditable(el, set) {
  el.contentEditable = editing ? "true" : "false";
  if (!editing) return;
  if (!el.textContent) el.style.minWidth = "3em";
  el.oninput = () => { set(el.textContent.trim()); markDirty(); };
  el.onkeydown = e => { if (e.key === "Enter" && !el.classList.contains("notes")) { e.preventDefault(); el.blur(); } };
}

function addTask(teamId) {
  const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
  const team = data.teams.find(t => t.id === teamId) || data.teams[0];
  const cats = team.categories || [];
  data.tasks.push({
    id, team: team.id, title: "New task", owner: "",
    subsystem: cats.includes("Other") ? "Other" : (cats[0] || ""),
    priority: "High", due: "", done: false, status: "todo", notes: "", parts: []
  });
  markDirty(); render(id);
}

/* ---------- Wire up ---------- */
$("unlockBtn").onclick = unlock;
$("lockBtn").onclick = lock;
$("saveBtn").onclick = () => save();
$("showPw").onclick = () => {
  const i = $("tokenInput"); const show = i.type === "password";
  i.type = show ? "text" : "password"; $("showPw").textContent = show ? "Hide" : "Show"; i.focus();
};
function setMenu(open) {
  $("side").classList.toggle("open", open); $("scrim").classList.toggle("open", open);
  $("menuBtn").setAttribute("aria-expanded", open);
}
$("menuBtn").onclick = () => setMenu(!$("side").classList.contains("open"));
$("scrim").onclick = () => setMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
window.addEventListener("hashchange", () => { setMenu(false); statusFilter = "all"; const f = flashId; if (!f) window.scrollTo(0, 0); render(); });
$("hideDone").onchange = e => {
  hideDone = e.target.checked;
  try { localStorage.setItem(HIDE_KEY, hideDone ? "1" : "0"); } catch {}
  render();
};
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s" && editing) { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => { if (token && await tryToken(token, false)) return; await load(); })();
</script>
</body>
</html>
