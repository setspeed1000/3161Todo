<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team 3161 Tasks</title>
<script>
  // Visual settings live in this browser only (see the Settings tab)
  try {
    const st = JSON.parse(localStorage.getItem("pages-edit-settings") || "{}");
    const r = document.documentElement;
    if (st.theme && st.theme !== "system") r.dataset.theme = st.theme;
    if (st.size && st.size !== "normal") r.dataset.size = st.size;
    if (st.density === "compact") r.dataset.density = "compact";
    if (st.motion === "reduce") r.dataset.motion = "reduce";
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceef0; --panel: #f8f9fa; --sunk: #d6dade; --ink: #1f2328; --muted: #5b6570;
    --line: #c9ced4; --yellow: #f5b700; --yellow-ink: #1f2328;
    --high: #f5b700; --med: #7c8c9c; --low: #b9c2cb;
    --red: #c9302c; --green: #2e7d4f; --edit: #fff8e1;
    --plate: #cdd2d7; --plate-ink: #1f2328; --nav-ink: #39414a; --nav-muted: #5b6570; --nav-hover: rgba(0,0,0,.06); --nav-active: #f8f9fa; --btn-line: #98a1aa;
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
      --bg: #15181b; --panel: #1e2226; --sunk: #272c31; --ink: #e8eaec; --muted: #98a2ad;
      --line: #333a41; --yellow: #f5b700; --yellow-ink: #15181b;
      --high: #f5b700; --med: #6f7f8f; --low: #3e4750;
      --red: #ef6461; --green: #5cc58a; --edit: #2b2615;
      --plate: #2a2f35; --plate-ink: #e8eaec; --nav-ink: #b9c1c9; --nav-muted: #8a939c; --nav-hover: rgba(255,255,255,.06); --nav-active: #3a4148; --btn-line: #59626b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15181b; --panel: #1e2226; --sunk: #272c31; --ink: #e8eaec; --muted: #98a2ad;
      --line: #333a41; --yellow: #f5b700; --yellow-ink: #15181b;
      --high: #f5b700; --med: #6f7f8f; --low: #3e4750;
      --red: #ef6461; --green: #5cc58a; --edit: #2b2615;
      --plate: #2a2f35; --plate-ink: #e8eaec; --nav-ink: #b9c1c9; --nav-muted: #8a939c; --nav-hover: rgba(255,255,255,.06); --nav-active: #3a4148; --btn-line: #59626b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Barlow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

  /* Layout: grey sidebar + one page per subteam */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh;
    background: linear-gradient(to right, var(--plate) 239px, var(--line) 239px 240px, transparent 240px); }
  .side { background: var(--plate); color: var(--plate-ink); position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; padding: 24px 12px 20px; overflow-y: auto;
    border-right: 1px solid var(--line); }
  .brand { padding: 0 10px 20px; }
  h1 { margin: 0; font: 700 28px/1 "Barlow Condensed", sans-serif; letter-spacing: -0.005em; }
  .sub { margin: 6px 0 0; color: var(--nav-muted); font-size: 13px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 7px 10px; border-radius: 4px; color: var(--nav-ink); text-decoration: none; font-weight: 500;
    border-left: 4px solid transparent; }
  .nav a:hover { background: var(--nav-hover); color: var(--plate-ink); }
  .nav a[aria-current="page"] { background: var(--nav-active); color: var(--plate-ink); font-weight: 600;
    border-left-color: var(--yellow); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .nav .n { font-size: 13px; color: var(--nav-muted); font-variant-numeric: tabular-nums; font-weight: 500; }
  .side-foot { margin-top: auto; padding: 20px 10px 0; }
  .overall { margin: 12px 0 0; font-size: 12px; color: var(--nav-muted); }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--btn-line); background: transparent; color: var(--plate-ink);
    padding: 7px 13px; border-radius: 4px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--nav-hover); }
  .btn.primary { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }

  .wrap { max-width: 860px; width: 100%; margin: 0 auto; padding: 30px 28px 80px; }
  .status { font-size: 14px; color: var(--muted); min-height: 1.5em; margin-bottom: 8px; }
  .status.err { color: var(--red); } .status.ok { color: var(--green); }

  /* Phone: the sidebar slides in from the left */
  .mtop { display: none; }
  .scrim { display: none; }
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .app { background: none; }
    .side { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; width: 250px; height: auto;
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: 4px 0 24px rgba(0,0,0,.2); }
    .side.open { transform: none; }
    .scrim.open { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(15,18,21,.45); }
    .mtop { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10;
      background: var(--plate); border-bottom: 1px solid var(--line); padding: 10px 16px; }
    .menu { border: 1px solid var(--btn-line); background: transparent; color: var(--plate-ink); border-radius: 4px;
      padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-weight: 500; }
    .menu svg { width: 18px; height: 18px; }
    .mtop-title { font: 700 20px/1 "Barlow Condensed", sans-serif; color: var(--plate-ink); }
    .wrap { padding: 18px 16px 80px; }
  }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }

  /* Subteam page header */
  .page-head { margin-bottom: 18px; }
  .page-title { margin: 0; font: 700 clamp(36px, 6vw, 54px)/0.95 "Barlow Condensed", sans-serif; letter-spacing: -0.01em; }
  .page-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin: 12px 0 7px; font-size: 14px; color: var(--muted); }
  .page-meta b { color: var(--ink); font-weight: 600; }
  .track { height: 8px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 2px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #e0a800 10px 20px);
    transition: width .5s ease; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

  /* Sidebar extras */
  .nav-sep { height: 1px; background: var(--btn-line); opacity: .5; margin: 8px 10px; }
  .nav a.hidden-tab { font-style: italic; }

  /* Calendar */
  .cal-bar { display: flex; align-items: center; gap: 8px; margin: 14px 0 12px; }
  .cal-bar .month { font: 700 24px/1 "Barlow Condensed", sans-serif; min-width: 9ch; }
  .cal-bar button, .tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px;
    padding: 5px 11px; cursor: pointer; }
  .cal-bar button:hover, .tbtn:hover { border-color: var(--muted); }
  .cal-bar .spacer { flex: 1; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px 2px; }
  .day { min-height: 84px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 7px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
    font-size: 12px; color: var(--muted); }
  .day:hover { border-color: var(--muted); }
  .day.out { background: transparent; border-color: transparent; opacity: .45; }
  .day .num { font-weight: 600; font-size: 14px; color: var(--ink); }
  .day.today .num { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 0 5px; align-self: flex-start; }
  .day.meet { border-top: 4px solid var(--yellow); padding-top: 3px; }
  .day.meet .m { color: var(--ink); font-weight: 600; }
  .day.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
  .day .due { color: var(--muted); }
  .day .due.over { color: var(--red); }
  .detail { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
  .detail h3 { margin: 0 0 4px; font: 700 24px/1.1 "Barlow Condensed", sans-serif; }
  .detail .note { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .detail h4 { margin: 16px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .teams-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchip { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 11px; font-size: 14px; color: var(--muted); }
  button.tchip { cursor: pointer; }
  .tchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .due-list { display: grid; gap: 4px; font-size: 14px; }
  .due-list a { color: var(--ink); }
  .muted { color: var(--muted); font-size: 14px; }

  /* Meetings (captains, edit mode only) */
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 8px; }
  .form-row label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .form-row input[type=date], .form-row input[type=text], .form-row input[type=password] { padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--panel); }
  .wd { display: flex; gap: 4px; flex-wrap: wrap; }
  .wd label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; font-size: 13px; color: var(--ink); background: var(--panel); cursor: pointer; }
  .tbtn.go { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
  .mlist { display: grid; gap: 4px; margin-top: 6px; }
  .mrow { display: grid; grid-template-columns: 11ch 1fr auto auto; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font-size: 14px; }
  .mrow .d { font-weight: 600; }
  .mrow .c { color: var(--muted); font-size: 13px; }
  .section { margin-bottom: 26px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 10px; }

  @media (max-width: 700px) {
    .day { min-height: 54px; padding: 4px; font-size: 11px; }
    .day .txt { display: none; }
    .day.meet::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); margin-top: auto; }
    .dow { padding: 0 2px; text-align: center; }
    .mrow { grid-template-columns: 1fr auto; }
    .mrow .note-cell { grid-column: 1 / -1; order: 3; }
  }

  /* Calendar zoom levels */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg a { padding: 5px 12px; color: var(--ink); text-decoration: none; background: var(--panel); font-size: 14px; }
  .seg a + a { border-left: 1px solid var(--line); }
  .seg a[aria-current] { background: var(--ink); color: var(--bg); font-weight: 600; }
  .cal-sub { margin: -4px 0 10px; }
  .day { cursor: pointer; }
  .boxes { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sbox { display: block; background: var(--sunk); border-left: 3px solid var(--yellow); color: var(--ink);
    text-decoration: none; font-size: 11.5px; font-weight: 600; line-height: 1.3; padding: 2px 6px; border-radius: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbox:hover { background: var(--yellow); color: var(--yellow-ink); }
  .sbox.more { border-left-color: var(--line); font-weight: 500; color: var(--muted); }
  .boxes.lg { flex-direction: row; flex-wrap: wrap; gap: 8px; }
  .sbox.lg { font-size: 16px; padding: 10px 14px; border-left-width: 5px; min-width: 150px; white-space: normal; }
  .sbox.lg small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .sbox.lg:hover small { color: inherit; }
  .small { font-size: 12px; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wk { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; min-height: 260px;
    display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
  .wk:hover { border-color: var(--muted); }
  .wk.meet { border-top: 4px solid var(--yellow); padding-top: 5px; }
  .wk.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
  .wk-head { display: flex; align-items: baseline; gap: 6px; }
  .wk-dow { font-size: 12px; font-weight: 600; color: var(--muted); }
  .wk-num { font: 700 22px/1 "Barlow Condensed", sans-serif; }
  .wk.today .wk-num { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 1px 5px; }
  .wk-note { font-size: 12px; color: var(--muted); }
  .wk-due { display: grid; gap: 3px; margin-top: auto; border-top: 1px dashed var(--line); padding-top: 6px; }
  .wk-due a { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-due a.over { color: var(--red); }

  @media (max-width: 700px) {
    .cal-bar { flex-wrap: wrap; }
    .cal-bar .month { font-size: 20px; min-width: 0; }
    .cal-bar .spacer { flex-basis: 100%; height: 0; }
    .week { grid-template-columns: 1fr; }
    .wk { min-height: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px 12px; align-content: start; }
    .wk.meet { border-top-width: 1px; border-left: 4px solid var(--yellow); padding-top: 8px; }
    .wk-head { grid-row: 1 / span 4; flex-direction: column; gap: 0; }
    .wk > :not(.wk-head) { grid-column: 2; }
    .wk-due { margin-top: 2px; }
    .sbox.lg { min-width: 0; flex: 1 1 140px; }
  }

  /* Team deadlines */
  .dlbox { display: block; background: color-mix(in srgb, var(--red) 13%, transparent); border-left: 3px solid var(--red);
    color: var(--red); text-decoration: none; font-size: 11.5px; font-weight: 700; line-height: 1.3; padding: 2px 6px;
    border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlbox:hover { background: var(--red); color: #fff; }
  .dlbox.lg { font-size: 17px; padding: 10px 14px; border-left-width: 5px; white-space: normal; }
  .dlbox.lg small { display: block; font-size: 12px; font-weight: 600; opacity: .85; margin-bottom: 2px; }
  .dl-row { margin-bottom: 14px; }
  .day.has-dl { box-shadow: inset 0 0 0 1px var(--red); }
  .agenda { white-space: pre-wrap; font-size: 15px; line-height: 1.55; background: var(--bg); border-radius: 4px;
    padding: 10px 12px; max-width: 70ch; }
  .agenda:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .sec-title { margin: 0 0 10px; font: 700 22px/1.1 "Barlow Condensed", sans-serif; }
  .form-row .grow { flex: 1 1 220px; }
  .form-row .grow input { width: 100%; }
  .agenda-in { display: grid; gap: 3px; font-size: 13px; color: var(--muted); margin: 4px 0 8px; max-width: 640px; }
  textarea { font: inherit; color: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel); resize: vertical; width: 100%; }
  .mwrap { display: grid; gap: 4px; }
  .mrow a.d { color: var(--ink); text-decoration: none; }
  .mrow a.d:hover { text-decoration: underline; }
  .mrow.dl { border-left: 4px solid var(--red); }
  .mrow.dl .note-cell { color: var(--red); font-weight: 600; }
  .agenda-edit { margin: 0 0 6px; }
  .tbtn.small { font-size: 13px; padding: 3px 9px; }

  /* Home */
  body.on-home .wrap { max-width: 1000px; }
  .hero { padding: 6px 0 26px; }
  .hero-date { margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .hero-title { margin: 0; font: 700 clamp(44px, 8vw, 84px)/0.9 "Barlow Condensed", sans-serif; letter-spacing: -0.015em; }
  .hero-stats { display: flex; gap: 10px 34px; flex-wrap: wrap; margin-top: 22px; }
  .stat { display: grid; }
  .stat b { font: 700 34px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 14px; }
  .stat.bad b { color: var(--red); }

  .home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; margin-bottom: 34px; align-items: start; }
  .home-side { display: grid; gap: 14px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; color: var(--ink);
    text-decoration: none; display: block; }
  .card-label { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); display: block; text-decoration: none; }
  a.card-label.link:hover { color: var(--ink); }
  a.card:hover { border-color: var(--muted); }

  .card.next { background: var(--plate); border-color: transparent; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .card.next::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 12px, #1f2328 12px 24px); }
  .card.next .card-label { color: var(--nav-muted); margin-top: 6px; }
  .next-date { display: flex; align-items: center; gap: 14px; }
  .nd-day { font: 700 96px/0.8 "Barlow Condensed", sans-serif; letter-spacing: -0.03em; }
  .nd-rest { white-space: pre-line; font: 600 22px/1.05 "Barlow Condensed", sans-serif; color: var(--nav-ink); }
  .next-note { margin: 14px 0 0; color: var(--nav-ink); }
  .next-boxes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .next-boxes .sbox, .next-boxes .dlbox { font-size: 13px; padding: 4px 9px; }
  .card.next .sbox { background: var(--nav-active); }
  .next-agenda { margin-top: 16px; white-space: pre-line; font-size: 14px; line-height: 1.5; color: var(--nav-ink);
    border-left: 2px solid var(--btn-line); padding-left: 12px; }
  .next-none { font: 600 24px/1.2 "Barlow Condensed", sans-serif; margin: 8px 0 0; }
  .card-go { margin-top: auto; padding-top: 18px; font-weight: 600; font-size: 14px; }
  .card.next:hover .card-go { text-decoration: underline; }

  .dl-line { display: grid; grid-template-columns: 9ch 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line);
    text-decoration: none; color: var(--ink); font-size: 14px; }
  .dl-line:hover .dl-what { text-decoration: underline; }
  .dl-when { color: var(--red); font-weight: 700; }
  .dl-what { font-weight: 500; }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .sday { display: grid; justify-items: center; gap: 2px; padding: 8px 0 9px; border-radius: 4px; text-decoration: none;
    color: var(--ink); background: var(--bg); border-top: 3px solid transparent; }
  .sday:hover { outline: 1px solid var(--muted); }
  .sd-dow { font-size: 11px; color: var(--muted); font-weight: 600; }
  .sd-num { font: 700 20px/1 "Barlow Condensed", sans-serif; }
  .sday.meet { border-top-color: var(--yellow); }
  .sday.dl .sd-num { color: var(--red); }
  .sday.today { background: var(--ink); color: var(--bg); }
  .sday.today .sd-dow { color: inherit; opacity: .7; }

  .home-h h3 { margin: 0 0 12px; font: 700 28px/1 "Barlow Condensed", sans-serif; }
  .team-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 14px 12px;
    text-decoration: none; color: var(--ink); display: grid; gap: 4px; }
  .tcard:hover { border-color: var(--ink); }
  .tc-name { font: 700 21px/1.05 "Barlow Condensed", sans-serif; }
  .tc-open { color: var(--muted); font-size: 14px; }
  .tc-open b { font: 700 30px/1 "Barlow Condensed", sans-serif; color: var(--ink); margin-right: 2px; }
  .tc-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); min-height: 1.4em; }
  .tc-meta .bad { color: var(--red); font-weight: 600; }
  .tc-track { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .tc-fill { display: block; height: 100%; background: var(--green); }

  @media (max-width: 860px) { .home-grid { grid-template-columns: 1fr; } }
  @media (max-width: 700px) {
    .nd-day { font-size: 76px; }
    .team-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* Settings (per device) */
  :root[data-size="large"] body { zoom: 1.12; }
  :root[data-size="xlarge"] body { zoom: 1.25; }
  :root[data-density="compact"] .task { padding: 7px 10px; gap: 8px; }
  :root[data-density="compact"] .team-list, :root[data-density="compact"] .list { gap: 3px; }
  :root[data-density="compact"] .title { font-size: 16px; }
  :root[data-density="compact"] .meta { margin-top: 2px; }
  :root[data-density="compact"] .notes { margin-top: 3px; }
  :root[data-density="compact"] .day { min-height: 64px; }
  :root[data-density="compact"] .nav a { padding: 6px 10px; }
  :root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before { transition: none !important; animation: none !important; }
  .set-group { padding: 16px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 8px 24px; align-items: center; }
  .set-group:first-child { border-top: none; }
  .set-name { font-weight: 600; }
  .set-group .seg { justify-self: start; flex-wrap: wrap; }
  .set-name small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .seg button { border: none; background: var(--panel); color: var(--ink); padding: 6px 14px; cursor: pointer; font-size: 14px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
  @media (max-width: 700px) { .set-group { grid-template-columns: 1fr; } }

  /* History */
  .hist { display: grid; gap: 6px; }
  .hrow { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; }
  .hrow-top { display: grid; grid-template-columns: minmax(0, 9ch) minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
  .h-who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-who.anon { color: var(--muted); font-weight: 500; }
  .h-what { min-width: 0; }
  .h-when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .h-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .h-tag { font-size: 12px; font-weight: 600; color: var(--green); }
  .h-detail ul { margin: 8px 0 2px; padding-left: 20px; font-size: 14px; color: var(--ink); }
  .h-detail li + li { margin-top: 2px; }
  .hist > .tbtn { justify-self: start; margin-top: 6px; }
  .dlg-field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .dlg-field input { padding: 9px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
  .name-in { padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); max-width: 260px; }
  @media (max-width: 700px) {
    .hrow-top { grid-template-columns: 1fr auto; }
    .h-what { grid-column: 1 / -1; order: 3; }
  }

  /* Status, blocked, parts, orders */
  .stp { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 3px; }
  .stp-doing { background: color-mix(in srgb, var(--yellow) 30%, transparent); color: var(--ink); }
  .stp-blocked { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
  .task.s-blocked { background-image: repeating-linear-gradient(-45deg, transparent 0 14px, color-mix(in srgb, var(--red) 5%, transparent) 14px 28px); }
  .blocked { margin-top: 7px; font-size: 14px; color: var(--red); display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; }
  .blocked b { font-weight: 700; }
  .blocked select, .blocked .bl-note { font-size: 13px; padding: 3px 6px; border: 1px dashed #c9a227; border-radius: 3px; background: var(--edit); color: var(--ink); }
  .blocked .bl-note { flex: 1 1 220px; }
  .st-sel { font-weight: 600; }
  .chip.warn .n { color: var(--red); font-weight: 700; }
  .chip.on.warn .n { color: inherit; }

  .parts { margin-top: 8px; display: grid; gap: 4px; }
  .pt-row { display: flex; gap: 8px; align-items: baseline; font-size: 14px; min-width: 0; }
  .pt { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 3px; white-space: nowrap; flex: none; }
  .pt-need { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
  .pt-ordered { background: color-mix(in srgb, var(--yellow) 28%, transparent); color: var(--ink); }
  .pt-arrived { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .pt-name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  a.pt-name { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
  .pt-head { font-size: 13px; font-weight: 600; color: var(--muted); }
  .pt-edit { display: grid; grid-template-columns: minmax(0, 1.4fr) 4.2em auto minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .pt-edit input, .pt-edit select { font-size: 13px; padding: 4px 6px; border: 1px dashed #c9a227; border-radius: 3px; background: var(--edit); color: var(--ink); min-width: 0; }
  .pt-add { justify-self: start; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 3px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .pt-add:hover { color: var(--ink); border-color: var(--muted); }

  .waiting { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--red); border-radius: 4px; padding: 14px 16px; margin-bottom: 16px; display: grid; gap: 6px; }
  .waiting .sec-title { margin-bottom: 4px; }
  .wait-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
  .wait-row a { color: var(--ink); font-weight: 600; }

  .orders { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 16px; }
  .orders-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
  .orders details { border-top: 1px solid var(--line); padding: 8px 0 4px; }
  .orders summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); margin: 0 0 4px; }
  .ord-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 5px 0; font-size: 14px; }
  .ord-for { color: var(--muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ord-for:hover { color: var(--ink); text-decoration: underline; }
  .ord-row select { font-size: 13px; padding: 3px 6px; border: 1px dashed #c9a227; border-radius: 3px; background: var(--edit); color: var(--ink); }

  @media (max-width: 700px) {
    .pt-edit { grid-template-columns: 4.6em minmax(0, 1fr) auto; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
    .pt-edit .pt-in-name { grid-column: 1 / -1; }
    .pt-edit .pt-in-link { grid-column: 1 / 3; }
    .ord-row { grid-template-columns: minmax(0, 1fr) auto; }
    .ord-for { grid-column: 1 / -1; order: 3; white-space: normal; }
  }

  /* Shop display (TV) */
  body.display-mode .app, body.display-mode .scrim { display: none !important; }
  body.display-mode { overflow: hidden; }
  body.display-mode.idle, body.display-mode.idle * { cursor: none; }
  .disp { position: fixed; inset: 0; z-index: 50; background: #121519; color: #eef0f2; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto; font-size: clamp(14px, 1.15vw, 26px); overflow: hidden; }
  .disp::before { content: ""; position: absolute; inset: 0 0 auto 0; height: .45em;
    background: repeating-linear-gradient(-45deg, #f5b700 0 1.1em, #121519 1.1em 2.2em); }
  .d-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 1em; padding: 1.4em 2em .6em; }
  .d-team { font: 700 2.1em/1 "Barlow Condensed", sans-serif; }
  .d-date { color: #9aa4ae; font-size: 1.05em; margin-top: .25em; }
  .d-clock { font: 700 4.6em/.85 "Barlow Condensed", sans-serif; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .d-ctrl { justify-self: end; display: flex; gap: .5em; transition: opacity .3s; }
  .d-ctrl button, .d-ctrl a { font: 500 .8em "Barlow", sans-serif; color: #c4cbd2; background: #22272d; border: 1px solid #3a4148;
    border-radius: 4px; padding: .45em .9em; text-decoration: none; cursor: pointer; }
  .d-ctrl button:hover, .d-ctrl a:hover { color: #fff; border-color: #6a737c; }
  body.idle .d-ctrl { opacity: 0; }
  .d-body { display: grid; grid-template-columns: minmax(0, 26%) minmax(0, 1fr); gap: 2em; padding: .8em 2em 1em; min-height: 0; }
  .d-side { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .5em; border-right: 1px solid #2a3037; padding-right: 2em; }
  .d-label { font-size: .85em; font-weight: 600; color: #9aa4ae; margin-top: .6em; }
  .d-big { font: 700 2.4em/1.02 "Barlow Condensed", sans-serif; }
  .d-sub { color: #c4cbd2; }
  .d-dls { display: grid; gap: .4em; margin-top: .6em; }
  .d-dl { display: grid; grid-template-columns: 6.5em 1fr; gap: .6em; padding: .55em .8em; border-left: .3em solid #ef6461;
    background: rgba(239, 100, 97, .1); border-radius: 3px; }
  .d-dl.soon { background: rgba(239, 100, 97, .22); }
  .d-dl-when { color: #ef6461; font-weight: 700; }
  .d-dl-what { font-weight: 600; }
  .d-agenda { white-space: pre-line; line-height: 1.5; font-size: 1.05em; color: #dfe3e7; overflow: hidden; min-height: 0; flex: 1 1 auto; }
  .d-agenda.clip { -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent); mask-image: linear-gradient(to bottom, #000 85%, transparent); }
  .d-main { min-height: 0; display: flex; flex-direction: column; }
  .d-cols { --n: 3; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 1em; margin-top: .6em; min-height: 0; flex: 1; }
  .d-col { background: #1b1f24; border-radius: 6px; padding: .9em; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .45em; border-top: .3em solid #f5b700; }
  .d-col-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 .5em; margin-bottom: .2em; }
  .d-col-name { font: 700 1.7em/1 "Barlow Condensed", sans-serif; }
  .d-col-n { color: #9aa4ae; font-size: .85em; white-space: nowrap; }
  .d-col-wait { font-size: .8em; font-weight: 700; color: #ef6461; }
  .d-task { background: #23282e; border-radius: 4px; padding: .55em .7em; border-left: .28em solid #3e4750; }
  .d-task.p-High { border-left-color: #f5b700; }
  .d-task.p-Med { border-left-color: #6f7f8f; }
  .d-task.s-blocked { background: repeating-linear-gradient(-45deg, #23282e 0 .9em, #2a2426 .9em 1.8em); }
  .d-task-top { display: flex; gap: .5em; align-items: baseline; justify-content: space-between; }
  .d-title { font-weight: 600; line-height: 1.25; }
  .d-task .stp { font-size: .7em; flex: none; }
  .d-task .stp-doing { background: rgba(245, 183, 0, .25); color: #f5d36a; }
  .d-task .stp-blocked { background: rgba(239, 100, 97, .2); color: #ef8a87; }
  .d-meta { display: flex; gap: .3em .9em; flex-wrap: wrap; align-items: baseline; font-size: .78em; color: #9aa4ae; margin-top: .25em; }
  .d-meta .stp { font-size: .9em; }
  .d-due.over { color: #ef6461; font-weight: 700; }
  .d-due.soon { color: #f5d36a; font-weight: 600; }
  .d-wait { color: #ef8a87; }
  .d-more { color: #9aa4ae; font-size: .8em; margin-top: auto; }
  .d-empty { font: 600 1.6em/1.2 "Barlow Condensed", sans-serif; color: #9aa4ae; margin-top: 1em; }
  .d-foot { display: flex; justify-content: space-between; gap: 1em; padding: .7em 2em 1em; border-top: 1px solid #2a3037; font-size: .85em; color: #9aa4ae; }
  .d-foot-l { display: flex; gap: 1.4em; }
  .d-foot .bad { color: #ef6461; font-weight: 700; }
  @media (max-width: 900px) {
    .disp { display: block; overflow-y: auto; font-size: 15px; }
    .d-bar { grid-template-columns: 1fr auto; padding: 1.2em 1em .5em; }
    .d-ctrl { grid-column: 1 / -1; justify-self: start; }
    .d-body { grid-template-columns: 1fr; padding: .5em 1em; }
    .d-side { border-right: none; padding-right: 0; }
    .d-cols { grid-template-columns: 1fr !important; flex: none; }
    .d-col, .d-side, .d-main, .d-body { overflow: visible; min-height: auto; }
    .d-clock { font-size: 3em; }
    .d-team { font-size: 1.6em; }
    .d-foot { flex-direction: column; padding: .7em 1em 1em; }
  }

  /* Members needed */
  .slots { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .slot-boxes { display: flex; gap: 4px; flex-wrap: wrap; }
  .slot { width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--muted); background: transparent; padding: 0; display: inline-block; }
  button.slot { cursor: pointer; }
  button.slot:hover { border-color: var(--ink); }
  .slot.on { background: var(--ink); border-color: var(--ink); }
  .slot-text { font-size: 13px; color: var(--muted); font-weight: 500; }
  .slots.full .slot.on { background: var(--red); border-color: var(--red); }
  .slots.full .slot-text { color: var(--red); font-weight: 700; }
  .need-sel { font-size: 13px; }
  .d-need { color: #f5d36a; font-weight: 600; }
  .d-full { color: #ef6461; font-weight: 700; }

  /* Dependencies */
  .deps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .deps-lab { color: var(--muted); font-weight: 600; }
  .dep-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--sunk); border-radius: 3px; padding: 2px 4px 2px 8px; max-width: 100%; }
  .dep-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep-chip.done { opacity: .6; text-decoration: line-through; }
  .dep-chip button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 3px; }
  .dep-chip button:hover { color: var(--red); }
  .dep-add { font-size: 13px; padding: 3px 6px; border: 1px dashed #c9a227; border-radius: 3px; background: var(--edit); color: var(--ink); max-width: 100%; }
  .blocked a.dep-link { color: var(--red); font-weight: 600; }
  .holds { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .holds b { font-weight: 600; }
  .holds a.dep-link { color: var(--ink); }
  .task.flash { outline: 3px solid var(--yellow); outline-offset: 2px; transition: outline-color 1.4s; }
  .st-sel:disabled { opacity: 1; color: var(--red); border-color: var(--red); }

  /* Workshops */
  .wsbox { display: block; background: var(--ink); color: var(--bg); text-decoration: none; font-size: 11.5px; font-weight: 700;
    line-height: 1.3; padding: 2px 6px; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--yellow); }
  .wsbox small { display: block; font-weight: 500; opacity: .75; font-size: 11px; }
  .wsbox:hover { background: var(--yellow); color: var(--yellow-ink); }
  .wk .wsbox { white-space: normal; }
  .wsbox.lg { font-size: 17px; padding: 10px 14px; border-left-width: 5px; white-space: normal; min-width: 220px; flex: 1 1 260px; }
  .wsbox.lg small { font-size: 12px; font-weight: 600; opacity: .8; margin-bottom: 2px; }
  .wsbox.lg .ws-title { display: block; }
  .wsbox.lg .ws-where { margin: 2px 0 0; }
  .wsbox.lg .ws-notes { display: block; font-size: 13px; font-weight: 500; opacity: .85; margin-top: 6px; white-space: pre-line; }
  .boxes.ws-row { margin-bottom: 10px; }
  .next-boxes .wsbox { font-size: 13px; padding: 4px 9px; }
  .sday.wsd { box-shadow: inset 0 -3px 0 var(--ink); }
  .sday.today.wsd { box-shadow: inset 0 -3px 0 var(--yellow); }
  .workshops { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--ink); border-radius: 4px; padding: 14px 16px; margin-bottom: 16px; display: grid; gap: 6px; }
  .workshops .sec-title { margin-bottom: 4px; }
  .ws-row { display: grid; grid-template-columns: 9ch minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
  .ws-row:first-of-type { border-top: none; }
  .ws-when { font-weight: 700; color: var(--ink); text-decoration: none; }
  .ws-when:hover { text-decoration: underline; }
  .ws-t { font-weight: 600; min-width: 0; }
  .ws-m { color: var(--muted); font-size: 14px; display: flex; gap: 6px; }
  .ws-m input { width: 9em; font-size: 13px; padding: 3px 6px; border: 1px dashed #c9a227; border-radius: 3px; background: var(--edit); color: var(--ink); }
  .ws-n { grid-column: 2 / -1; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .ws-n:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .7; }
  .ws-form { margin-top: 6px; }
  .d-ws { display: grid; padding: .5em .8em; border-left: .3em solid #f5b700; background: #1e2328; border-radius: 3px; margin-bottom: .4em; }
  .d-ws-t { font-weight: 700; font-size: 1.15em; }
  .d-ws-m { color: #9aa4ae; font-size: .85em; }
  @media (max-width: 700px) {
    .ws-row { grid-template-columns: minmax(0, 1fr) auto; }
    .ws-when { grid-column: 1 / -1; }
    .ws-m { grid-column: 1 / -1; flex-wrap: wrap; }
    .ws-n { grid-column: 1 / -1; }
  }

  /* Events and countdown */
  .evbox { display: block; background: var(--yellow); color: var(--yellow-ink); text-decoration: none; font-size: 11.5px; font-weight: 800;
    line-height: 1.3; padding: 2px 6px; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evbox:hover { filter: brightness(1.08); }
  .day.has-ev { border-color: var(--yellow); }
  .ev-banner { display: grid; gap: 2px; background: var(--yellow); color: var(--yellow-ink); border-radius: 4px; padding: 12px 16px; margin-bottom: 12px; }
  .ev-banner small { font-size: 12px; font-weight: 700; opacity: .75; }
  .ev-banner strong { font: 700 26px/1.05 "Barlow Condensed", sans-serif; }
  .ev-banner span { font-size: 14px; font-weight: 500; }
  .evcard { border-top: 5px solid var(--yellow); }
  .ev-row { display: flex; align-items: baseline; gap: 8px; }
  .ev-n { font: 700 64px/.9 "Barlow Condensed", sans-serif; letter-spacing: -0.02em; }
  .ev-unit { font: 600 20px/1 "Barlow Condensed", sans-serif; color: var(--muted); }
  .ev-name { font: 700 22px/1.1 "Barlow Condensed", sans-serif; margin-top: 8px; }
  .ev-meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .ev-dl { font-size: 13px; color: var(--red); font-weight: 600; margin-top: 8px; }
  .mrow.ev { border-left: 4px solid var(--yellow); }
  .ev-loc { padding: 4px 8px; border: 1px dashed #c9a227; border-radius: 3px; background: var(--edit); color: var(--ink); font-size: 13px; width: 12em; }
  .form-row select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); font: inherit; }
  .d-ev { margin-top: .35em; color: #f5b700; font: 700 1.25em/1.1 "Barlow Condensed", sans-serif; }

  /* My tasks */
  .page-head a { color: var(--ink); }
  .mine-h { display: block; margin: 18px 0 8px; font: 700 22px/1 "Barlow Condensed", sans-serif; color: var(--ink); text-decoration: none; }
  .mine-h:first-child { margin-top: 4px; }
  .mine-h:hover { text-decoration: underline; }
  .my-line { display: grid; gap: 1px; padding: 8px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .my-line:hover .my-t { text-decoration: underline; }
  .my-t { font-weight: 600; font-size: 14px; }
  .my-m { font-size: 12.5px; color: var(--muted); }
  .my-m.bad { color: var(--red); font-weight: 600; }
  .my-more { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
  @media (max-width: 700px) { .ev-loc { width: 100%; } }

  /* Toolbar */
  .tools { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 4px;
    cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: baseline; }
  .chip .n { color: var(--muted); font-size: 12px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.on .n { color: inherit; opacity: .7; }
  .toggle { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .toggle input { accent-color: var(--ink); }

  /* Tasks */
  .list { display: grid; gap: 6px; }
  .task { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--low);
    border-radius: 4px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
  .task.p-High { border-left-color: var(--high); }

<script>
/* ---------- Config ---------- */
// Auto-detected on *.github.io; fallbacks used when opened anywhere else.
const FALLBACK_OWNER = "setspeed1000";
const FALLBACK_REPO  = "3161todo";
const DATA_PATH      = "data.json";
const TOKEN_KEY      = "pages-edit-token";
const HIDE_KEY       = "pages-edit-hide-done";
const SETTINGS_KEY   = "pages-edit-settings";
const NAME_KEY       = "pages-edit-name";
let base = null;         // the document as last loaded or saved; the starting point for merging

// Used when data.json has no "teams" yet. Edit names and categories in data.json.
const DEFAULT_TEAMS = [
  { id: "mechanical",  name: "Mechanical",  leads: [], categories: ["Drivetrain", "Intake", "Shooter", "Climber", "Elevator", "Frame", "Field elements", "Other"] },
  { id: "design",      name: "Design",      leads: [], categories: ["CAD", "Prototyping", "Drawings", "Other"] },
  { id: "programming", name: "Programming", leads: [], categories: ["Drive", "Autonomous", "Vision", "Subsystems", "Dashboard", "Other"] },
  { id: "electrical",  name: "Electrical",  leads: [], categories: ["Wiring", "Power", "Sensors", "CAN", "Pneumatics", "Other"] },
  { id: "strategy",    name: "Strategy",    leads: [], categories: ["Game analysis", "Match strategy", "Pick list", "Other"] },
  { id: "scouting",    name: "Scouting",    leads: [], categories: ["Scouting app", "Match scouting", "Pit scouting", "Data", "Other"] },
  { id: "business",    name: "Business",    leads: [], categories: ["Sponsorship", "Grants", "Budget", "Awards", "Other"] },
  { id: "outreach",    name: "Outreach",    leads: [], categories: ["Events", "FLL", "Community", "Other"] },
  { id: "media",       name: "Media",       leads: [], categories: ["Photos", "Video", "Social media", "Branding", "Other"] },
  { id: "inventory",   name: "Inventory & Logistics", leads: [], categories: ["Ordering", "Inventory", "Shop", "Travel", "Other"] },
  { id: "captains",    name: "General",    leads: [], categories: ["Planning", "Communication", "Events", "Admin", "Other"], calendar: false }
];
// Subteams with calendar: false (General) are never marked active on the calendar and their tasks stay off it;
// their workshops still show
const inCal = id => (data.teams.find(t => t.id === id) || {}).calendar !== false;
const PRIORITIES = ["High", "Med", "Low"];
const PRI_RANK   = { High: 0, Med: 1, Low: 2 };
const STATUSES   = [["todo", "To do"], ["doing", "In progress"], ["blocked", "Blocked"], ["done", "Done"]];
const ST_RANK    = { doing: 0, todo: 1, blocked: 2, done: 3 };
const ST_LABEL   = Object.fromEntries(STATUSES);
const PART_ST    = [["need", "Need to order"], ["ordered", "Ordered"], ["arrived", "Arrived"]];
const PART_LABEL = { need: "To order", ordered: "Ordered", arrived: "Arrived" };
let statusFilter = "all";

// A task's status; "done" stays in sync with the old done checkbox field
// Dependencies: a task is Blocked while any task it depends on is unfinished, then falls back to its own status
function openDeps(t, tasks) {
  tasks = tasks || (data && data.tasks) || [];
  return (t.dependsOn || []).map(id => tasks.find(x => x.id === id)).filter(d => d && !d.done);
}
const ownSt = t => t.done ? "done" : (t.status && t.status !== "done" ? t.status : "todo");
const stOf = (t, tasks) => t.done ? "done" : openDeps(t, tasks).length ? "blocked" : ownSt(t);
// Does task a depend on b, directly or through other tasks?
function dependsOnTask(a, bId, seen = new Set()) {
  if (seen.has(a.id)) return false; seen.add(a.id);
  return (a.dependsOn || []).some(id => id === bId || ((x => x && dependsOnTask(x, bId, seen))(data.tasks.find(t => t.id === id))));
}
// Tasks (from other subteams) held up by this subteam: manual "waiting on" or an unfinished dependency it owns
function waitingOn(teamId) {
  const out = [];
  data.tasks.forEach(t => {
    if (t.done) return;
    const deps = openDeps(t).filter(d => d.team === teamId && t.team !== teamId);
    if (deps.length) out.push({ t, why: deps.map(d => d.title).join(", ") });
    else if (ownSt(t) === "blocked" && t.blockedBy === teamId) out.push({ t, why: t.blockedNote || "" });
  });
  return out;
}
let flashId = null;      // task to scroll to after following a dependency link
function taskLink(d) {
  const a = document.createElement("a");
  a.href = "#" + encodeURIComponent(d.team); a.textContent = d.title; a.className = "dep-link";
  a.title = `${d.title} (${teamName(d.team)})`;
  a.onclick = () => { flashId = d.id; if (location.hash === a.getAttribute("href")) render(); };
  return a;
}
function setSt(t, st) {
  t.status = st; t.done = st === "done";
  if (st !== "blocked") { delete t.blockedBy; delete t.blockedNote; }
}
const newId = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());

const { owner: OWNER, repo: REPO } = detectRepo();
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

/* ---------- State ---------- */
let data = null;        // the JSON document
let sha = null;         // blob sha of data.json (needed to commit)
let branch = null;
let token = loadToken();
let editing = false;
let dirty = false;
let hideDone = (() => { try { return localStorage.getItem(HIDE_KEY) === "1"; } catch { return false; } })();

const $ = id => document.getElementById(id);

function detectRepo() {
  const h = location.hostname;
  if (h.endsWith(".github.io")) {
    const owner = h.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return { owner, repo: seg || h };
  }
  return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
}

function loadToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function saveToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }

function setStatus(msg, kind = "") { const s = $("status"); s.textContent = msg; s.className = "status " + kind; }

function headers(extra = {}) {
  const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...extra };
  if (token) h.Authorization = `Bearer ${token}`;
  return h;
}

/* ---------- UTF-8 safe base64 ---------- */
function toB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ---------- Load ---------- */
// Read through the API (fresh, gives sha). Falls back to the Pages copy if the API is rate-limited.
async function load() {
  setStatus("Loading…");
  let raw, note = "";
  try {
    const r = await fetch(`${API}/contents/${DATA_PATH}${branch ? `?ref=${branch}` : ""}`, { headers: headers(), cache: "no-store" });
    if (!r.ok) throw new Error(`API ${r.status}`);
    const j = await r.json();
    sha = j.sha;
    raw = JSON.parse(fromB64(j.content));
  } catch (e) {
    const r = await fetch(`${DATA_PATH}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) { setStatus("Couldn't load the task list. Reload the page to try again.", "err"); return; }
    raw = await r.json();
    sha = null;
    note = "Showing the published copy. It can lag the latest save by about a minute.";
  }
  data = raw;
  setStatus(note);
  normalize(data);
  base = structuredClone(data);
  dirty = false;
  render();
}

// Fill in teams and give every task a team, so older data.json files keep working.
function normalize(d) {
  if (!Array.isArray(d.teams)) d.teams = [];
  DEFAULT_TEAMS.forEach(x => { if (!d.teams.some(t => t.id === x.id)) d.teams.push(structuredClone(x)); });
  if (!Array.isArray(d.tasks)) d.tasks = [];
  if (!Array.isArray(d.meetings)) d.meetings = [];
  if (!Array.isArray(d.deadlines)) d.deadlines = [];
  if (!Array.isArray(d.workshops)) d.workshops = [];
  if (!Array.isArray(d.events)) d.events = [];
  const ids = d.teams.map(t => t.id);
  d.tasks.forEach(t => {
    if (!ids.includes(t.team)) t.team = ids[0];
    if (t.done) t.status = "done"; else if (!t.status || t.status === "done") t.status = "todo";
    if (!Array.isArray(t.parts)) t.parts = [];
  });
  return d;
}
const teamOf = t => data.teams.find(x => x.id === t.team) || data.teams[0];

/* ---------- Auth ---------- */
function myName() { try { return (localStorage.getItem(NAME_KEY) || "").trim(); } catch { return ""; } }
function setMyName(n) { try { n ? localStorage.setItem(NAME_KEY, n.trim()) : localStorage.removeItem(NAME_KEY); } catch {} }

// Resolves to the saver's name, asking once per device if it isn't known yet
function askName() {
  if (myName()) return Promise.resolve(myName());
  return new Promise(res => {
    const d = $("nameDlg");
    $("nameOnly").value = "";
    d.showModal();
    d.addEventListener("close", function once() {
      d.removeEventListener("close", once);
      const n = $("nameOnly").value.trim();
      if (d.returnValue === "ok" && n) { setMyName(n); res(n); } else res(null);
    });
  });
}

async function unlock() {
  $("nameInput").value = myName();
  $("tokenInput").value = "";
  $("tokenInput").type = "password";
  $("showPw").textContent = "Show";
  $("tokenDlg").showModal();
  $("tokenDlg").addEventListener("close", async function once() {
    $("tokenDlg").removeEventListener("close", once);
    if ($("tokenDlg").returnValue !== "ok") return;
    if ($("nameInput").value.trim()) setMyName($("nameInput").value);
    const pw = $("tokenInput").value.trim();
    if (!pw) return;
    // A raw GitHub token still works as a fallback.
    if (/^(github_pat_|ghp_)/.test(pw)) { await tryToken(pw, true); return; }
    setStatus("Checking password…");
    const t = await decryptToken(pw);
    if (!t) { setStatus("Wrong password. Check capitals and trailing spaces.", "err"); return; }
    await tryToken(t, true);
  });
}

/* ---------- Password → token ----------
   secret.json holds the GitHub token encrypted with AES-GCM, keyed by PBKDF2(password).
   The token never appears in plain text in the repo. Make secret.json with setup.html. */
async function decryptToken(password) {
  try {
    const r = await fetch(`secret.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return null;
    const s = await r.json();
    const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b(s.salt), iterations: s.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(s.iv) }, key, b(s.ct));
    return new TextDecoder().decode(pt);
  } catch { return null; }   // AES-GCM throws on a wrong password
}

async function tryToken(t, announce) {
  token = t;
  setStatus("Checking access…");
  const r = await fetch(API, { headers: headers() });
  const j = r.ok ? await r.json() : null;
  if (!j || !j.permissions || !j.permissions.push) {
    token = null; saveToken(null);
    setStatus(r.status === 401 ? "The saved token is invalid or expired. Rerun setup.html with a new token." : "That token can't write to this repo.", "err");
    return false;
  }
  saveToken(t);
  branch = j.default_branch;
  editing = true;
  await load();
  if (announce) setStatus("Editing unlocked. Tap any text to change it.", "ok");
  return true;
}

function lock() {
  if (dirty && !confirm("Discard unsaved changes?")) return;
  token = null; saveToken(null); editing = false; load();
}

/* ---------- Save: merge with whatever others saved since we loaded ----------
   base   = the document as it was when this browser last loaded or saved
   data   = base plus this person's edits
   remote = the latest version on GitHub
   Each of this person's changes is applied on top of remote, so two people editing
   different things never lose each other's work. If both changed the same field,
   the person saving now wins, and the earlier value is still in History. */
function isObj(v) { return v && typeof v === "object" && !Array.isArray(v); }
function deepEq(a, b) {
  if (a === b) return true;
  if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x, i) => deepEq(x, b[i]));
  if (isObj(a) && isObj(b)) {
    const ka = Object.keys(a).filter(k => a[k] !== undefined), kb = Object.keys(b).filter(k => b[k] !== undefined);
    return ka.length === kb.length && ka.every(k => deepEq(a[k], b[k]));
  }
  return (a == null || a === "") && (b == null || b === "");   // treat missing, null and "" as the same
}
const prim = a => Array.isArray(a) && a.every(x => x === null || typeof x !== "object");

function merge3(b, l, r, st) {
  if (deepEq(l, b)) return structuredClone(r);
  if (deepEq(r, b) || deepEq(l, r)) return structuredClone(l);
  const keyed = a => Array.isArray(a) && a.every(x => isObj(x) && x.id);
  if (keyed(l) && keyed(r) && (b === undefined || keyed(b))) return mergeList(b || [], l, r, x => x.id, st);
  if (prim(l) && prim(r) && (b === undefined || prim(b))) {
    // Lists like "active subteams": apply this person's additions and removals to the latest list
    const B = b || [], add = l.filter(x => !B.includes(x)), del = B.filter(x => !l.includes(x));
    return [...r.filter(x => !del.includes(x)), ...add.filter(x => !r.includes(x))];
  }
  if (isObj(l) && isObj(r)) {
    const out = {}, B = isObj(b) ? b : {};
    new Set([...Object.keys(r), ...Object.keys(l)]).forEach(k => {
      const v = merge3(B[k], l[k], r[k], st);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  st.conflicts++;
  return structuredClone(l);
}

function mergeList(b = [], l = [], r = [], key, st) {
  const mb = new Map(b.map(x => [key(x), x])), ml = new Map(l.map(x => [key(x), x])), mr = new Map(r.map(x => [key(x), x]));
  const out = [];
  const take = k => {
    const B = mb.get(k), L = ml.get(k), R = mr.get(k);
    if (!B) return L && R ? merge3(undefined, L, R, st) : structuredClone(L || R);
    if (!L) { if (!R || deepEq(R, B)) return undefined; st.kept++; return structuredClone(R); }   // deleted here, but someone edited it
    if (!R) return deepEq(L, B) ? undefined : structuredClone(L);                                  // deleted there, unless edited here
    return merge3(B, L, R, st);
  };
  const seen = new Set();
  [...r, ...l].forEach(x => {
    const k = key(x); if (seen.has(k)) return; seen.add(k);
    const v = take(k); if (v !== undefined) out.push(v);
  });
  return out;
}

const LISTS = { tasks: x => x.id, teams: x => x.id, meetings: x => x.date, deadlines: x => x.id, workshops: x => x.id, events: x => x.id };
function mergeDoc(b, l, r) {
  const st = { conflicts: 0, kept: 0 };
  const out = {};
  new Set([...Object.keys(r), ...Object.keys(l)]).forEach(k => {
    if (k === "updated") return;
    const v = LISTS[k] ? mergeList(b[k], l[k], r[k], LISTS[k], st) : merge3(b[k], l[k], r[k], st);
    if (v !== undefined) out[k] = v;
  });
  out.meetings && out.meetings.sort((a, c) => a.date.localeCompare(c.date));
  return { doc: out, st };
}

async function fetchLatest(ref) {
  const r = await fetch(`${API}/contents/${DATA_PATH}?ref=${encodeURIComponent(ref || branch || "main")}`, { headers: headers(), cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return { sha: j.sha, doc: normalize(JSON.parse(fromB64(j.content))) };
}

async function putDoc(doc, prevSha, message) {
  return fetch(`${API}/contents/${DATA_PATH}`, {
    method: "PUT", headers: headers({ "Content-Type": "application/json" }),
    body: JSON.stringify({ message, content: toB64(JSON.stringify(doc, null, 2) + "\n"), branch, sha: prevSha })
  });
}

/* ---------- Describing changes (used for commit messages and History) ---------- */
function describeChanges(b, a) {
  const out = [];
  const q = t => `"${(t || "untitled").slice(0, 40)}"`;
  const short = d => parseDate(d) ? niceDate(d, { month: "short", day: "numeric" }) : d;
  const tn = id => ((a.teams || []).find(t => t.id === id) || (b.teams || []).find(t => t.id === id) || {}).name || id;
  const byKey = (arr, k) => new Map((arr || []).map(x => [k(x), x]));

  if ((b.title || "") !== (a.title || "")) out.push(`renamed the site to ${q(a.title)}`);
  const bT = byKey(b.teams, x => x.id), aT = byKey(a.teams, x => x.id);
  aT.forEach((t, id) => { const o = bT.get(id); if (o && o.name !== t.name) out.push(`renamed ${o.name} to ${t.name}`); });

  const bk = byKey(b.tasks, x => x.id), ak = byKey(a.tasks, x => x.id);
  ak.forEach((t, id) => {
    const o = bk.get(id);
    if (!o) return out.push(`added ${q(t.title)} to ${tn(t.team)}`);
    if (deepEq(o, t)) return;
    if (!o.done && t.done) {
      out.push(`completed ${q(t.title)}`);
      (a.tasks || []).filter(x => !x.done && (x.dependsOn || []).includes(t.id) && !openDeps(x, a.tasks).length)
        .forEach(x => out.push(`unblocked ${q(x.title)}`));
    }
    const da = t.dependsOn || [], db = o.dependsOn || [];
    const tt = id => q(((a.tasks || []).find(x => x.id === id) || (b.tasks || []).find(x => x.id === id) || {}).title);
    da.filter(x => !db.includes(x)).forEach(x => out.push(`made ${q(t.title)} depend on ${tt(x)}`));
    if (o.done && !t.done) out.push(`reopened ${q(t.title)}`);
    db.filter(x => !da.includes(x)).forEach(x => out.push(`removed ${tt(x)} as a dependency of ${q(t.title)}`));
    if (o.team !== t.team) out.push(`moved ${q(t.title)} to ${tn(t.team)}`);
    if (o.title !== t.title) out.push(`renamed ${q(o.title)} to ${q(t.title)}`);
    const so = ownSt(o), sn = ownSt(t);
    if (so !== sn && so !== "done" && sn !== "done") {
      if (sn === "doing") out.push(`started ${q(t.title)}`);
      else if (sn === "blocked") out.push(`marked ${q(t.title)} blocked${t.blockedBy ? ` (waiting on ${tn(t.blockedBy)})` : ""}`);
      else out.push(`moved ${q(t.title)} back to To do`);
    } else if (sn === "blocked" && so === "blocked" && ((o.blockedBy || "") !== (t.blockedBy || "") || (o.blockedNote || "") !== (t.blockedNote || "")))
      out.push(`updated what ${q(t.title)} is waiting on`);
    const op = new Map((o.parts || []).map(x => [x.id, x])), np = new Map((t.parts || []).map(x => [x.id, x]));
    np.forEach((x, pid) => {
      const y = op.get(pid);
      if (!y) return out.push(`added part ${q(x.name)} to ${q(t.title)}`);
      if ((y.status || "need") !== (x.status || "need")) out.push(x.status === "need" ? `marked ${q(x.name)} as needed` : `marked ${q(x.name)} ${(x.status || "").toLowerCase()}`);
      else if (!deepEq(y, x)) out.push(`edited part ${q(x.name)}`);
    });
    op.forEach((x, pid) => { if (!np.has(pid)) out.push(`removed part ${q(x.name)} from ${q(t.title)}`); });
    if ((o.needed || 0) !== (t.needed || 0)) out.push(t.needed ? `set ${q(t.title)} to need ${t.needed} member${t.needed === 1 ? "" : "s"}` : `removed the member count from ${q(t.title)}`);
    else if (t.needed && (o.filled || 0) !== (t.filled || 0)) out.push((t.filled || 0) >= t.needed ? `filled every slot on ${q(t.title)}` : `${t.filled || 0} of ${t.needed} slots filled on ${q(t.title)}`);
    const rest = ["owner", "subsystem", "priority", "due", "notes"].filter(k => (o[k] || "") !== (t[k] || ""));
    if (rest.length && o.done === t.done && o.title === t.title && o.team === t.team) out.push(`edited ${q(t.title)} (${rest.join(", ")})`);
  });
  bk.forEach((t, id) => { if (!ak.has(id)) out.push(`deleted ${q(t.title)}`); });

  const bm = byKey(b.meetings, x => x.date), am = byKey(a.meetings, x => x.date);
  const newM = [...am.keys()].filter(d => !bm.has(d)), goneM = [...bm.keys()].filter(d => !am.has(d));
  if (newM.length > 2) out.push(`added ${newM.length} meetings`); else newM.forEach(d => out.push(`added a meeting on ${short(d)}`));
  if (goneM.length > 2) out.push(`removed ${goneM.length} meetings`); else goneM.forEach(d => out.push(`removed the meeting on ${short(d)}`));
  am.forEach((m, d) => {
    const o = bm.get(d); if (!o) return;
    const A = m.active || [], B = o.active || [];
    A.filter(x => !B.includes(x)).forEach(x => out.push(`marked ${tn(x)} active on ${short(d)}`));
    B.filter(x => !A.includes(x)).forEach(x => out.push(`marked ${tn(x)} inactive on ${short(d)}`));
    if ((o.agenda || "") !== (m.agenda || "")) out.push(`${o.agenda ? "updated" : "added"} the agenda for ${short(d)}`);
    if ((o.note || "") !== (m.note || "")) out.push(`changed the time for ${short(d)}`);
  });

  const bd = byKey(b.deadlines, x => x.id), ad = byKey(a.deadlines, x => x.id);
  ad.forEach((x, id) => { const o = bd.get(id); if (!o) out.push(`added deadline ${q(x.title)} on ${short(x.date)}`); else if (!deepEq(o, x)) out.push(`edited deadline ${q(x.title)}`); });
  bd.forEach((x, id) => { if (!ad.has(id)) out.push(`removed deadline ${q(x.title)}`); });
  const be = byKey(b.events, x => x.id), ae = byKey(a.events, x => x.id);
  ae.forEach((x, id) => { const o = be.get(id); if (!o) out.push(`added the event ${q(x.name)} on ${short(x.start)}`); else if (!deepEq(o, x)) out.push(`edited the event ${q(x.name)}`); });
  be.forEach((x, id) => { if (!ae.has(id)) out.push(`removed the event ${q(x.name)}`); });
  const bw = byKey(b.workshops, x => x.id), aw = byKey(a.workshops, x => x.id);
  aw.forEach((x, id) => { const o = bw.get(id); if (!o) out.push(`scheduled the ${tn(x.team)} workshop ${q(x.title)} for ${short(x.date)}`); else if (!deepEq(o, x)) out.push(`edited the workshop ${q(x.title)}`); });
  bw.forEach((x, id) => { if (!aw.has(id)) out.push(`cancelled the workshop ${q(x.title)}`); });
  return out;
}

function commitMessage(who, changes) {
  const list = changes.length ? changes : ["saved without changes"];
  let head = `${who}: ${list[0]}`;
  if (list.length === 2) head += `; ${list[1]}`;
  if (list.length > 2) head += ` and ${list.length - 1} more change${list.length === 2 ? "" : "s"}`;
  return list.length > 1 ? `${head}\n\n${list.map(c => "- " + c).join("\n")}` : head;
}

async function save(opts) {
  opts = opts && opts.message ? opts : {};
  if (opts.message) dirty = true;
  if (!dirty) return;
  const who = await askName();
  if (!who) return setStatus("Add your name to save.", "err");
  $("saveBtn").disabled = true;
  setStatus("Saving…");
  const mine = describeChanges(base, data);
  const message = opts.message ? `${who}: ${opts.message}` : commitMessage(who, mine);
  for (let attempt = 0; attempt < 4; attempt++) {
    let latest;
    try { latest = await fetchLatest(); }
    catch (e) { setStatus(`Couldn't reach GitHub (${e.message}). Your changes are still here; try Save again.`, "err"); $("saveBtn").disabled = false; return; }
    const changed = latest.sha !== sha;
    const { doc, st } = changed ? mergeDoc(base, data, latest.doc) : { doc: structuredClone(data), st: { conflicts: 0, kept: 0 } };
    doc.updated = new Date().toISOString();
    const r = await putDoc(doc, latest.sha, message);
    if (r.ok) {
      const j = await r.json();
      sha = j.content.sha;
      data = doc; base = structuredClone(doc); dirty = false;
      historyCache = null;
      const notes = [];
      if (changed) notes.push("Merged with changes someone else saved");
      if (st.conflicts) notes.push(`${st.conflicts} field${st.conflicts === 1 ? " was" : "s were"} edited by both of you, so yours ${st.conflicts === 1 ? "was" : "were"} kept`);
      if (st.kept) notes.push(`${st.kept} item${st.kept === 1 ? "" : "s"} you deleted had been edited by someone else, so ${st.kept === 1 ? "it was" : "they were"} kept`);
      setStatus(notes.length ? `Saved. ${notes.join(". ")}.` : "Saved. The public page updates in about a minute.", "ok");
      render();
      return true;
    }
    if (r.status !== 409 && r.status !== 422) {
      setStatus(`Save failed (${r.status}). Your changes are still here; try Save again.`, "err");
      $("saveBtn").disabled = false;
      return;
    }
    // Someone saved between our read and write: read again and re-merge
  }
  setStatus("Several people are saving at once. Wait a few seconds and press Save again.", "err");
  $("saveBtn").disabled = false;
}

// While editing with nothing unsaved, quietly pick up other people's saves
setInterval(async () => {
  if (!editing || dirty || document.hidden || !data) return;
  const a = document.activeElement;
  if (a && (a.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
  try {
    const latest = await fetchLatest();
    if (latest.sha !== sha && !dirty) { sha = latest.sha; data = latest.doc; base = structuredClone(data); historyCache = null; render(); }
  } catch {}
}, 45000);

function markDirty() { dirty = true; $("saveBtn").disabled = false; setStatus("Unsaved changes."); }

/* ---------- Dates ---------- */
function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dueInfo(t) {
  const d = parseDate(t.due);
  if (!d) return { text: "No due date", cls: "" };
  const days = Math.round((d - today()) / 86400000);
  const label = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  if (t.done) return { text: `Due ${label}`, cls: "" };
  if (days < 0) return { text: `Overdue ${-days} day${days === -1 ? "" : "s"}`, cls: "over" };
  if (days === 0) return { text: "Due today", cls: "soon" };
  if (days === 1) return { text: "Due tomorrow", cls: "soon" };
  return { text: `Due ${label}`, cls: "" };
}

function sortTasks(arr) {
  return [...arr].sort((a, b) =>
    (PRI_RANK[a.priority] ?? 3) - (PRI_RANK[b.priority] ?? 3) ||
    (ST_RANK[stOf(a)] ?? 1) - (ST_RANK[stOf(b)] ?? 1) ||
    (a.due || "9999") .localeCompare(b.due || "9999") ||
    (a.title || "").localeCompare(b.title || ""));
}

const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function niceDate(s, opts = { weekday: "long", month: "long", day: "numeric" }) { return parseDate(s).toLocaleDateString(undefined, opts); }
const meetingOn = s => data.meetings.find(m => m.date === s);
const deadlinesOn = s => data.deadlines.filter(d => d.date === s);
const workshopsOn = s => (data.workshops || []).filter(w => w.date === s).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

/* ---------- Competitions and events ---------- */
const eventsOn = ds => (data.events || []).filter(e => e.start && e.start <= ds && ds <= (e.end || e.start));
const eventName = id => ((data.events || []).find(e => e.id === id) || {}).name || "";
function nextEvent() {
  const ts = iso(today());
  return (data.events || []).filter(e => e.start && (e.end || e.start) >= ts).sort((a, b) => a.start.localeCompare(b.start))[0];
}
// { n, unit, text } for a countdown, or "on now" while the event is running
function countdown(e) {
  const t0 = today(), s = parseDate(e.start), end = parseDate(e.end || e.start);
  const days = Math.round((s - t0) / 86400000);
  if (days > 0) return { n: days, unit: days === 1 ? "day" : "days", text: days === 1 ? "Tomorrow" : `In ${days} days` };
  const total = Math.round((end - s) / 86400000) + 1, day = Math.round((t0 - s) / 86400000) + 1;
  return { n: "Now", unit: total > 1 ? `day ${day} of ${total}` : "today", text: total > 1 ? `Day ${day} of ${total}` : "Today" };
}
function eventDates(e) {
  const o = { weekday: "short", month: "short", day: "numeric" };
  return e.end && e.end !== e.start ? `${niceDate(e.start, o)} to ${niceDate(e.end, o)}` : niceDate(e.start, o);
}

/* ---------- My tasks: tasks whose owner matches the name saved on this device ---------- */
function ownerMatches(owner, name) {
  if (!owner || !name) return false;
  const n = name.trim().toLowerCase(), first = n.split(/\s+/)[0];
  return owner.split(/\s*(?:,|&|\/|\+|\band\b)\s*/i).some(tok => {
    const t = tok.trim().toLowerCase();
    return t && (t === n || t === first || t.split(/\s+/)[0] === first);
  });
}
const myTasks = () => data.tasks.filter(t => ownerMatches(t.owner, myName()));

}

    requestAnimationFrame(() => {

      if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
    });
  }

/* ---------- History: every save is a commit; list them and restore old versions ---------- */
let historyCache = null;     // { at, items, page, more }

async function fetchHistory(page) {
  const r = await fetch(`${API}/commits?path=${DATA_PATH}&per_page=25&page=${page}`, { headers: headers(), cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).map(c => {
    const msg = c.commit.message || "";
    const first = msg.split("\n")[0];
    const m = first.match(/^([^:\n]{1,40}): (.+)$/);
    const legacy = first === "Update tasks via site";
    return {
      sha: c.sha, parent: (c.parents[0] || {}).sha, url: c.html_url,
      when: new Date(c.commit.committer.date),
      who: m ? m[1] : legacy ? "" : "",
      what: m ? m[2] : legacy ? "Saved from the site" : first,
      details: msg.split("\n").filter(l => l.startsWith("- ")).map(l => l.slice(2)),
      legacy: legacy || !m,
      label: m ? m[1] : legacy ? "Someone" : "GitHub"   // old site saves had no name; others were made on GitHub directly
    };
  });
}

function ago(d) {
  const s = (Date.now() - d) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 86400 * 7) return `${Math.round(s / 86400)} days ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function renderHistory() {
  const head = div("page-head");
  const h2 = document.createElement("h2"); h2.className = "page-title"; h2.textContent = "History";
  const sub = div("muted", editing
    ? "Every save, newest first. Restoring puts the whole list back to that point; later changes stay here so nothing is lost."
    : "Every save, newest first. Unlock editing to restore an older version.");
  sub.style.marginTop = "8px";
  head.append(h2, sub);
  $("pageHead").replaceChildren(head);
  const list = $("list");
  list.innerHTML = "";
  const box = div("hist");
  list.append(box);

  const draw = () => {
    if (currentPage() !== "history") return;
    box.innerHTML = "";
    const c = historyCache;
    if (!c.items.length) box.append(div("muted", "No saves yet."));
    c.items.forEach((it, i) => box.append(histRow(it, i === 0)));
    if (c.more) {
      const more = document.createElement("button"); more.className = "tbtn"; more.textContent = "Show older";
      more.onclick = async () => {
        more.disabled = true;
        try { const next = await fetchHistory(c.page + 1); c.items.push(...next); c.page++; c.more = next.length === 25; }
        catch (e) { setStatus(`Couldn't load more history (${e.message}).`, "err"); }
        draw();
      };
      box.append(more);
    }
  };

  if (historyCache && Date.now() - historyCache.at < 30000) return draw();
  box.append(div("muted", "Loading history…"));
  fetchHistory(1).then(items => { historyCache = { at: Date.now(), items, page: 1, more: items.length === 25 }; draw(); })
    .catch(e => { box.innerHTML = ""; box.append(div("muted", `Couldn't load history (${e.message}). GitHub limits how often a device can ask without editing unlocked; try again in a few minutes.`)); });
}

function histRow(it, isLatest) {
  const row = div("hrow");
  const top = div("hrow-top");
  const who = div("h-who", it.label);
  if (!it.who) who.classList.add("anon");
  const what = div("h-what", it.what);
  const when = div("h-when", ago(it.when));
  when.title = it.when.toLocaleString();
  top.append(who, what, when);
  row.append(top);

  const actions = div("h-actions");
  const detail = div("h-detail"); detail.hidden = true;
  if (it.details.length) { const ul = document.createElement("ul"); it.details.forEach(d => ul.append(Object.assign(document.createElement("li"), { textContent: d }))); detail.append(ul); }
  if (it.details.length || (it.legacy && it.parent)) {
    const show = document.createElement("button"); show.className = "tbtn small"; show.textContent = "Show changes";
    show.onclick = async () => {
      if (!detail.hidden) { detail.hidden = true; show.textContent = "Show changes"; return; }
      if (!it.details.length && !detail.dataset.done) {
        show.disabled = true; show.textContent = "Loading…";
        try {
          const [a, b] = await Promise.all([fetchLatest(it.sha), fetchLatest(it.parent)]);
          const ch = describeChanges(b.doc, a.doc);
          const ul = document.createElement("ul");
          (ch.length ? ch : ["No changes to tasks, meetings or deadlines"]).forEach(d => ul.append(Object.assign(document.createElement("li"), { textContent: d })));
          detail.append(ul); detail.dataset.done = "1";
        } catch (e) { detail.append(div("muted", `Couldn't compare (${e.message}).`)); detail.dataset.done = "1"; }
        show.disabled = false;
      }
      detail.hidden = false; show.textContent = "Hide changes";
    };
    actions.append(show);
  }
  if (editing && !isLatest) {
    const rb = document.createElement("button"); rb.className = "tbtn small"; rb.textContent = "Restore this version";
    rb.onclick = () => restoreVersion(it);
    actions.append(rb);
  }
  if (isLatest) actions.append(div("h-tag", "Current"));
  if (actions.childNodes.length) row.append(actions);
  row.append(detail);
  return row;
}

async function restoreVersion(it) {
  const when = it.when.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  if (dirty && !confirm("You have unsaved changes. Discard them and restore this version?")) return;
  if (!confirm(`Put the whole list back to how it was on ${when}?\n\nEverything saved after that is undone, but stays in History so it can be brought back.`)) return;
  const who = await askName();
  if (!who) return setStatus("Add your name to restore.", "err");
  setStatus("Restoring…");
  try {
    const old = await fetchLatest(it.sha);
    for (let attempt = 0; attempt < 3; attempt++) {
      const latest = await fetchLatest();
      const doc = structuredClone(old.doc);
      doc.updated = new Date().toISOString();
      const r = await putDoc(doc, latest.sha, `${who}: restored the version from ${when}`);
      if (r.ok) {
        const j = await r.json();
        sha = j.content.sha; data = doc; base = structuredClone(doc); dirty = false; historyCache = null;
        setStatus(`Restored the version from ${when}.`, "ok");
        render();
        return;
      }
      if (r.status !== 409 && r.status !== 422) throw new Error(r.status);
    }
    throw new Error("busy");
  } catch (e) { setStatus(`Restore failed (${e.message}). Nothing was changed.`, "err"); }
}

/* ---------- Shop display: full-screen board for a TV in the shop ----------
   Refreshes itself every minute. Without editing unlocked it reads the published
   copy of data.json, so it never runs into GitHub's hourly limit. */
let dispUpdated = null, dispError = false, wakeLock = null, idleTimer = null;

async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock && !document.hidden) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

async function refreshDisplay() {
  if (currentPage() !== "display" || dirty) return;
  try {
    let doc;
    if (editing) { const l = await fetchLatest(); sha = l.sha; doc = l.doc; }
    else {
      const r = await fetch(`${DATA_PATH}?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      doc = normalize(await r.json());
    }
    data = doc; base = structuredClone(doc); dispUpdated = new Date(); dispError = false;
  } catch { dispError = true; }
  render();
}

function dTask(t, ts) {
  const st = stOf(t);
  const r = el("div", "d-task p-" + t.priority + " s-" + st);
  r.append(el("div", "d-title", t.title));
  const meta = el("div", "d-meta");
  if (st === "doing" || st === "blocked") meta.append(el("span", "stp stp-" + st, ST_LABEL[st]));
  if (t.owner) meta.append(el("span", "", t.owner));
  if (t.due) {
    const d = dueInfo(t);
    if (d.cls) meta.append(el("span", "d-due " + d.cls, d.text));
  }
  const od = openDeps(t);
  if (od.length) meta.append(el("span", "d-wait", `Waiting on ${od.map(d => d.title).join(", ")}`));
  else if (st === "blocked") meta.append(el("span", "d-wait", t.blockedBy ? `Waiting on ${teamName(t.blockedBy)}` : "Blocked"));
  if (t.needed) { const f = Math.min(t.filled || 0, t.needed); meta.append(el("span", f >= t.needed ? "d-full" : "d-need", f >= t.needed ? "Full" : `Needs ${t.needed - f} more`)); }
  const need = (t.parts || []).filter(p => (p.status || "need") !== "arrived").length;
  if (need) meta.append(el("span", "", `${need} part${need === 1 ? "" : "s"} not here`));
  if (meta.childNodes.length) r.append(meta);
  return r;
}
