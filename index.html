<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceef0; --panel: #f8f9fa; --sunk: #d6dade; --ink: #1f2328; --muted: #5b6570;
    --line: #c9ced4; --yellow: #f5b700; --yellow-ink: #1f2328;
    --high: #f5b700; --med: #7c8c9c; --low: #b9c2cb;
    --red: #c9302c; --green: #2e7d4f; --edit: #fff8e1;
    --plate: #cdd2d7; --plate-ink: #1f2328; --nav-ink: #39414a; --nav-muted: #5b6570; --nav-hover: rgba(0,0,0,.06); --nav-active: #f8f9fa; --btn-line: #98a1aa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b; --panel: #1e2226; --sunk: #272c31; --ink: #e8eaec; --muted: #98a2ad;
      --line: #333a41; --yellow: #f5b700; --yellow-ink: #15181b;
      --high: #f5b700; --med: #6f7f8f; --low: #3e4750;
      --red: #ef6461; --green: #5cc58a; --edit: #2b2615;
      --plate: #2a2f35; --plate-ink: #e8eaec; --nav-ink: #b9c1c9; --nav-muted: #8a939c; --nav-hover: rgba(255,255,255,.06); --nav-active: #3a4148; --btn-line: #59626b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Barlow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

  /* Layout: grey sidebar + one page per subteam */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--plate); color: var(--plate-ink); position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; padding: 24px 12px 20px; overflow-y: auto;
    border-right: 1px solid var(--line); }
  .brand { padding: 0 10px 20px; }
  h1 { margin: 0; font: 700 28px/1 "Barlow Condensed", sans-serif; letter-spacing: -0.005em; }
  .sub { margin: 6px 0 0; color: var(--nav-muted); font-size: 13px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 9px 10px; border-radius: 4px; color: var(--nav-ink); text-decoration: none; font-weight: 500;
    border-left: 4px solid transparent; }
  .nav a:hover { background: var(--nav-hover); color: var(--plate-ink); }
  .nav a[aria-current="page"] { background: var(--nav-active); color: var(--plate-ink); font-weight: 600;
    border-left-color: var(--yellow); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .nav .n { font-size: 13px; color: var(--nav-muted); font-variant-numeric: tabular-nums; font-weight: 500; }
  .side-foot { margin-top: auto; padding: 20px 10px 0; }
  .overall { margin: 12px 0 0; font-size: 12px; color: var(--nav-muted); }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--btn-line); background: transparent; color: var(--plate-ink);
    padding: 7px 13px; border-radius: 4px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--nav-hover); }
  .btn.primary { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }

  .wrap { max-width: 860px; width: 100%; margin: 0 auto; padding: 30px 28px 80px; }
  .status { font-size: 14px; color: var(--muted); min-height: 1.5em; margin-bottom: 8px; }
  .status.err { color: var(--red); } .status.ok { color: var(--green); }

  /* Phone: the sidebar slides in from the left */
  .mtop { display: none; }
  .scrim { display: none; }
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; width: 250px; height: auto;
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: 4px 0 24px rgba(0,0,0,.2); }
    .side.open { transform: none; }
    .scrim.open { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(15,18,21,.45); }
    .mtop { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10;
      background: var(--plate); border-bottom: 1px solid var(--line); padding: 10px 16px; }
    .menu { border: 1px solid var(--btn-line); background: transparent; color: var(--plate-ink); border-radius: 4px;
      padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-weight: 500; }
    .menu svg { width: 18px; height: 18px; }
    .mtop-title { font: 700 20px/1 "Barlow Condensed", sans-serif; color: var(--plate-ink); }
    .wrap { padding: 18px 16px 80px; }
  }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }

  /* Subteam page header */
  .page-head { margin-bottom: 18px; }
  .page-title { margin: 0; font: 700 clamp(36px, 6vw, 54px)/0.95 "Barlow Condensed", sans-serif; letter-spacing: -0.01em; }
  .page-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin: 12px 0 7px; font-size: 14px; color: var(--muted); }
  .page-meta b { color: var(--ink); font-weight: 600; }
  .track { height: 8px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 2px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #e0a800 10px 20px);
    transition: width .5s ease; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

  /* Sidebar extras */
  .nav-sep { height: 1px; background: var(--btn-line); opacity: .5; margin: 10px 10px; }
  .nav a.hidden-tab { font-style: italic; }

  /* Calendar */
  .cal-bar { display: flex; align-items: center; gap: 8px; margin: 14px 0 12px; }
  .cal-bar .month { font: 700 24px/1 "Barlow Condensed", sans-serif; min-width: 9ch; }
  .cal-bar button, .tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px;
    padding: 5px 11px; cursor: pointer; }
  .cal-bar button:hover, .tbtn:hover { border-color: var(--muted); }
  .cal-bar .spacer { flex: 1; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px 2px; }
  .day { min-height: 84px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 7px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
    font-size: 12px; color: var(--muted); }
  .day:hover { border-color: var(--muted); }
  .day.out { background: transparent; border-color: transparent; opacity: .45; }
  .day .num { font-weight: 600; font-size: 14px; color: var(--ink); }
  .day.today .num { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 0 5px; align-self: flex-start; }
  .day.meet { border-top: 4px solid var(--yellow); padding-top: 3px; }
  .day.meet .m { color: var(--ink); font-weight: 600; }
  .day.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
  .day .due { color: var(--muted); }
  .day .due.over { color: var(--red); }
  .detail { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
  .detail h3 { margin: 0 0 4px; font: 700 24px/1.1 "Barlow Condensed", sans-serif; }
  .detail .note { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .detail h4 { margin: 16px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .teams-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchip { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 11px; font-size: 14px; color: var(--muted); }
  button.tchip { cursor: pointer; }
  .tchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .due-list { display: grid; gap: 4px; font-size: 14px; }
  .due-list a { color: var(--ink); }
  .muted { color: var(--muted); font-size: 14px; }

  /* Meetings (captains, edit mode only) */
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 8px; }
  .form-row label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .form-row input[type=date], .form-row input[type=text] { padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--panel); }
  .wd { display: flex; gap: 4px; flex-wrap: wrap; }
  .wd label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; font-size: 13px; color: var(--ink); background: var(--panel); cursor: pointer; }
  .tbtn.go { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
  .mlist { display: grid; gap: 4px; margin-top: 6px; }
  .mrow { display: grid; grid-template-columns: 11ch 1fr auto auto; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font-size: 14px; }
  .mrow .d { font-weight: 600; }
  .mrow .c { color: var(--muted); font-size: 13px; }
  .section { margin-bottom: 26px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 10px; }

  @media (max-width: 700px) {
    .day { min-height: 54px; padding: 4px; font-size: 11px; }
    .day .txt { display: none; }
    .day.meet::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); margin-top: auto; }
    .dow { padding: 0 2px; text-align: center; }
    .mrow { grid-template-columns: 1fr auto; }
    .mrow .note-cell { grid-column: 1 / -1; order: 3; }
  }

  /* Calendar zoom levels */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg a { padding: 5px 12px; color: var(--ink); text-decoration: none; background: var(--panel); font-size: 14px; }
  .seg a + a { border-left: 1px solid var(--line); }
  .seg a[aria-current] { background: var(--ink); color: var(--bg); font-weight: 600; }
  .cal-sub { margin: -4px 0 10px; }
  .day { cursor: pointer; }
  .boxes { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sbox { display: block; background: var(--sunk); border-left: 3px solid var(--yellow); color: var(--ink);
    text-decoration: none; font-size: 11.5px; font-weight: 600; line-height: 1.3; padding: 2px 6px; border-radius: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbox:hover { background: var(--yellow); color: var(--yellow-ink); }
  .sbox.more { border-left-color: var(--line); font-weight: 500; color: var(--muted); }
  .boxes.lg { flex-direction: row; flex-wrap: wrap; gap: 8px; }
  .sbox.lg { font-size: 16px; padding: 10px 14px; border-left-width: 5px; min-width: 150px; white-space: normal; }
  .sbox.lg small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .sbox.lg:hover small { color: inherit; }
  .small { font-size: 12px; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wk { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; min-height: 260px;
    display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
  .wk:hover { border-color: var(--muted); }
  .wk.meet { border-top: 4px solid var(--yellow); padding-top: 5px; }
  .wk.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
  .wk-head { display: flex; align-items: baseline; gap: 6px; }
  .wk-dow { font-size: 12px; font-weight: 600; color: var(--muted); }
  .wk-num { font: 700 22px/1 "Barlow Condensed", sans-serif; }
  .wk.today .wk-num { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 1px 5px; }
  .wk-note { font-size: 12px; color: var(--muted); }
  .wk-due { display: grid; gap: 3px; margin-top: auto; border-top: 1px dashed var(--line); padding-top: 6px; }
  .wk-due a { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-due a.over { color: var(--red); }

  @media (max-width: 700px) {
    .cal-bar { flex-wrap: wrap; }
    .cal-bar .month { font-size: 20px; min-width: 0; }
    .cal-bar .spacer { flex-basis: 100%; height: 0; }
    .week { grid-template-columns: 1fr; }
    .wk { min-height: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px 12px; align-content: start; }
    .wk.meet { border-top-width: 1px; border-left: 4px solid var(--yellow); padding-top: 8px; }
    .wk-head { grid-row: 1 / span 4; flex-direction: column; gap: 0; }
    .wk > :not(.wk-head) { grid-column: 2; }
    .wk-due { margin-top: 2px; }
    .sbox.lg { min-width: 0; flex: 1 1 140px; }
  }

  /* Toolbar */
  .tools { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 4px;
    cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: baseline; }
  .chip .n { color: var(--muted); font-size: 12px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.on .n { color: inherit; opacity: .7; }
  .toggle { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .toggle input { accent-color: var(--ink); }

  /* Tasks */
  .list { display: grid; gap: 6px; }
  .task { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--low);
    border-radius: 4px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
  .task.p-High { border-left-color: var(--high); }
  .task.p-Med  { border-left-color: var(--med); }
  .task.done { background: transparent; border-left-color: var(--line); }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  .task.done .meta, .task.done .notes { opacity: .6; }
  .check { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--green); cursor: pointer; }
  .check:disabled { cursor: default; }
  .title { font: 600 18px/1.25 "Barlow Condensed", sans-serif; letter-spacing: .005em; }
  .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 5px; align-items: center; }
  .meta b { font-weight: 500; color: var(--ink); }
  .tag { background: var(--sunk); color: var(--ink); padding: 1px 7px; border-radius: 3px; font-size: 12px; font-weight: 500; }
  .due.over { color: var(--red); font-weight: 600; }
  .due.soon { color: var(--ink); font-weight: 600; }
  .notes { font-size: 14px; margin-top: 7px; white-space: pre-wrap; color: var(--ink); }
  .right { display: flex; gap: 6px; align-items: center; }
  .pri { font-size: 12px; font-weight: 600; color: var(--muted); }
  .p-High .pri { color: var(--ink); }

  [contenteditable="true"] { background: var(--edit); outline: 1px dashed #c9a227; border-radius: 3px; padding: 0 3px; cursor: text; }
  .editing select, .editing input[type=date] { font-size: 13px; padding: 2px 4px;
    background: var(--edit); border: 1px dashed #c9a227; border-radius: 3px; }
  .del { border: none; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer; }
  .del:hover { color: var(--red); }

  .empty { color: var(--muted); padding: 14px 2px; font-size: 14px; }
  .donehead { margin: 14px 0 6px; font: 600 15px/1 "Barlow Condensed", sans-serif; color: var(--muted); }

  /* Subteam sections */
  .team { margin-bottom: 34px; scroll-margin-top: 12px; }
  .team-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: end;
    padding-bottom: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--ink); }
  .team-name { margin: 0; font: 700 32px/1 "Barlow Condensed", sans-serif; letter-spacing: -0.005em; }
  .team-count { font: 600 16px/1 "Barlow Condensed", sans-serif; color: var(--muted); text-align: right; white-space: nowrap; }
  .team-count b { color: var(--ink); font-size: 22px; }
  .leads { grid-column: 1 / -1; display: flex; gap: 4px 18px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .leads b { color: var(--ink); font-weight: 600; }
  .team-list { display: grid; gap: 6px; }
  .addrow { margin-top: 8px; border: 1px dashed var(--line); background: transparent; color: var(--muted);
    width: 100%; padding: 9px; border-radius: 4px; cursor: pointer; text-align: left; }
  .addrow:hover { color: var(--ink); border-color: var(--muted); }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }

  dialog { border: none; border-radius: 6px; background: var(--panel); color: var(--ink);
    max-width: 400px; width: calc(100% - 32px); padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(15,18,21,.6); }
  dialog h2 { margin: 0; font: 700 26px/1 "Barlow Condensed", sans-serif; }
  dialog p { font-size: 14px; color: var(--muted); margin: 8px 0 14px; }
  .pw { display: flex; gap: 6px; }
  .pw input { flex: 1; padding: 9px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
  .pw button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 0 10px; cursor: pointer; font-size: 13px; }
  .dlg-bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dlg-bar button { padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
  .dlg-bar .go { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); font-weight: 600; }

  @media (max-width: 560px) {
    .task { grid-template-columns: auto 1fr; }
    .right { grid-column: 2; }
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1 data-field="title">Loading</h1>
      <p class="sub" data-field="subtitle"></p>
    </div>
    <nav class="nav" id="nav" aria-label="Subteams"></nav>
    <div class="side-foot">
      <div class="bar">
        <button class="btn" id="unlockBtn">Unlock editing</button>
        <button class="btn primary" id="saveBtn" hidden disabled>Save</button>
        <button class="btn" id="lockBtn" hidden>Lock</button>
      </div>
      <p class="overall" id="overall"></p>
    </div>
  </aside>

  <div>
  <header class="mtop">
    <button class="menu" id="menuBtn" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      Menu
    </button>
    <span class="mtop-title" id="mtopTitle"></span>
  </header>
  <main class="wrap">
    <div id="status" class="status" role="status"></div>
    <div id="pageHead"></div>
    <div class="tools" id="tools">
      <span></span>
      <label class="toggle"><input type="checkbox" id="hideDone"> Hide done</label>
    </div>
    <div id="list"></div>
    <footer id="footer"></footer>
  </main>
  </div>
</div>

<dialog id="tokenDlg">
  <form method="dialog">
    <h2>Unlock editing</h2>
    <p id="pwHint">Enter the editor password, or paste a GitHub token directly.</p>
    <div class="pw">
      <input id="tokenInput" type="password" autocomplete="off" placeholder="Password" aria-label="Password">
      <button type="button" id="showPw">Show</button>
    </div>
    <div class="dlg-bar">
      <button value="cancel">Cancel</button>
      <button class="go" id="tokenOk" value="ok">Unlock</button>
    </div>
  </form>
</dialog>

<script>
/* ---------- Config ---------- */
// Auto-detected on *.github.io; fallbacks used when opened anywhere else.
const FALLBACK_OWNER = "setspeed1000";
const FALLBACK_REPO  = "3161todo";
const DATA_PATH      = "data.json";
const TOKEN_KEY      = "pages-edit-token";
const HIDE_KEY       = "pages-edit-hide-done";

// Used when data.json has no "teams" yet. Edit names and categories in data.json.
const DEFAULT_TEAMS = [
  { id: "mechanical",  name: "Mechanical",  leads: [], categories: ["Drivetrain", "Intake", "Shooter", "Climber", "Elevator", "Frame", "Field elements", "Other"] },
  { id: "design",      name: "Design",      leads: [], categories: ["CAD", "Prototyping", "Drawings", "Other"] },
  { id: "programming", name: "Programming", leads: [], categories: ["Drive", "Autonomous", "Vision", "Subsystems", "Dashboard", "Other"] },
  { id: "electrical",  name: "Electrical",  leads: [], categories: ["Wiring", "Power", "Sensors", "CAN", "Pneumatics", "Other"] },
  { id: "strategy",    name: "Strategy",    leads: [], categories: ["Game analysis", "Match strategy", "Pick list", "Other"] },
  { id: "scouting",    name: "Scouting",    leads: [], categories: ["Scouting app", "Match scouting", "Pit scouting", "Data", "Other"] },
  { id: "business",    name: "Business",    leads: [], categories: ["Sponsorship", "Grants", "Budget", "Awards", "Other"] },
  { id: "outreach",    name: "Outreach",    leads: [], categories: ["Events", "FLL", "Community", "Other"] },
  { id: "media",       name: "Media",       leads: [], categories: ["Photos", "Video", "Social media", "Branding", "Other"] },
  { id: "inventory",   name: "Inventory & Logistics", leads: [], categories: ["Ordering", "Inventory", "Shop", "Travel", "Other"] }
];
const PRIORITIES = ["High", "Med", "Low"];
const PRI_RANK   = { High: 0, Med: 1, Low: 2 };

const { owner: OWNER, repo: REPO } = detectRepo();
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

/* ---------- State ---------- */
let data = null;        // the JSON document
let sha = null;         // blob sha of data.json (needed to commit)
let branch = null;
let token = loadToken();
let editing = false;
let dirty = false;
let hideDone = (() => { try { return localStorage.getItem(HIDE_KEY) === "1"; } catch { return false; } })();

const $ = id => document.getElementById(id);

function detectRepo() {
  const h = location.hostname;
  if (h.endsWith(".github.io")) {
    const owner = h.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return { owner, repo: seg || h };
  }
  return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
}

function loadToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function saveToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }

function setStatus(msg, kind = "") { const s = $("status"); s.textContent = msg; s.className = "status " + kind; }

function headers(extra = {}) {
  const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...extra };
  if (token) h.Authorization = `Bearer ${token}`;
  return h;
}

/* ---------- UTF-8 safe base64 ---------- */
function toB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ---------- Load ---------- */
// Read through the API (fresh, gives sha). Falls back to the Pages copy if the API is rate-limited.
async function load() {
  setStatus("Loading…");
  try {
    const r = await fetch(`${API}/contents/${DATA_PATH}${branch ? `?ref=${branch}` : ""}`, { headers: headers(), cache: "no-store" });
    if (!r.ok) throw new Error(`API ${r.status}`);
    const j = await r.json();
    sha = j.sha;
    data = JSON.parse(fromB64(j.content));
    setStatus("");
  } catch (e) {
    const r = await fetch(`${DATA_PATH}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) { setStatus("Couldn't load the task list. Reload the page to try again.", "err"); return; }
    data = await r.json();
    sha = null;
    setStatus("Showing the published copy. It can lag the latest save by about a minute.");
  }
  normalize();
  dirty = false;
  render();
}

// Fill in teams and give every task a team, so older data.json files keep working.
function normalize() {
  if (!Array.isArray(data.teams)) data.teams = [];
  DEFAULT_TEAMS.forEach(d => { if (!data.teams.some(t => t.id === d.id)) data.teams.push(structuredClone(d)); });
  if (!Array.isArray(data.tasks)) data.tasks = [];
  if (!Array.isArray(data.meetings)) data.meetings = [];
  const ids = data.teams.map(t => t.id);
  data.tasks.forEach(t => { if (!ids.includes(t.team)) t.team = ids[0]; });
}
const teamOf = t => data.teams.find(x => x.id === t.team) || data.teams[0];

/* ---------- Auth ---------- */
async function unlock() {
  $("tokenInput").value = "";
  $("tokenInput").type = "password";
  $("showPw").textContent = "Show";
  $("tokenDlg").showModal();
  $("tokenDlg").addEventListener("close", async function once() {
    $("tokenDlg").removeEventListener("close", once);
    if ($("tokenDlg").returnValue !== "ok") return;
    const pw = $("tokenInput").value.trim();
    if (!pw) return;
    // A raw GitHub token still works as a fallback.
    if (/^(github_pat_|ghp_)/.test(pw)) { await tryToken(pw, true); return; }
    setStatus("Checking password…");
    const t = await decryptToken(pw);
    if (!t) { setStatus("Wrong password. Check capitals and trailing spaces.", "err"); return; }
    await tryToken(t, true);
  });
}

/* ---------- Password → token ----------
   secret.json holds the GitHub token encrypted with AES-GCM, keyed by PBKDF2(password).
   The token never appears in plain text in the repo. Make secret.json with setup.html. */
async function decryptToken(password) {
  try {
    const r = await fetch(`secret.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return null;
    const s = await r.json();
    const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b(s.salt), iterations: s.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(s.iv) }, key, b(s.ct));
    return new TextDecoder().decode(pt);
  } catch { return null; }   // AES-GCM throws on a wrong password
}

async function tryToken(t, announce) {
  token = t;
  setStatus("Checking access…");
  const r = await fetch(API, { headers: headers() });
  const j = r.ok ? await r.json() : null;
  if (!j || !j.permissions || !j.permissions.push) {
    token = null; saveToken(null);
    setStatus(r.status === 401 ? "The saved token is invalid or expired. Rerun setup.html with a new token." : "That token can't write to this repo.", "err");
    return false;
  }
  saveToken(t);
  branch = j.default_branch;
  editing = true;
  await load();
  if (announce) setStatus("Editing unlocked. Tap any text to change it.", "ok");
  return true;
}

function lock() {
  if (dirty && !confirm("Discard unsaved changes?")) return;
  token = null; saveToken(null); editing = false; load();
}

/* ---------- Save ---------- */
async function save() {
  if (!dirty) return;
  $("saveBtn").disabled = true;
  setStatus("Saving…");
  data.updated = new Date().toISOString();
  const body = {
    message: `Update tasks via site`,
    content: toB64(JSON.stringify(data, null, 2) + "\n"),
    branch,
    ...(sha ? { sha } : {})
  };
  const r = await fetch(`${API}/contents/${DATA_PATH}`, { method: "PUT", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
  if (r.ok) {
    const j = await r.json();
    sha = j.content.sha;
    dirty = false;
    setStatus("Saved. The public page updates in about a minute.", "ok");
    render();
  } else if (r.status === 409 || r.status === 422) {
    setStatus("Someone else saved first. Their version is loaded; redo your change.", "err");
    await load();
  } else {
    setStatus(`Save failed (${r.status}).`, "err");
    $("saveBtn").disabled = false;
  }
}

function markDirty() { dirty = true; $("saveBtn").disabled = false; setStatus("Unsaved changes."); }

/* ---------- Dates ---------- */
function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dueInfo(t) {
  const d = parseDate(t.due);
  if (!d) return { text: "No due date", cls: "" };
  const days = Math.round((d - today()) / 86400000);
  const label = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  if (t.done) return { text: `Due ${label}`, cls: "" };
  if (days < 0) return { text: `Overdue ${-days} day${days === -1 ? "" : "s"}`, cls: "over" };
  if (days === 0) return { text: "Due today", cls: "soon" };
  if (days === 1) return { text: "Due tomorrow", cls: "soon" };
  return { text: `Due ${label}`, cls: "" };
}

function sortTasks(arr) {
  return [...arr].sort((a, b) =>
    (PRI_RANK[a.priority] ?? 3) - (PRI_RANK[b.priority] ?? 3) ||
    (a.due || "9999") .localeCompare(b.due || "9999") ||
    (a.title || "").localeCompare(b.title || ""));
}

/* ---------- Render ---------- */
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function niceDate(s, opts = { weekday: "long", month: "long", day: "numeric" }) { return parseDate(s).toLocaleDateString(undefined, opts); }
const meetingOn = s => data.meetings.find(m => m.date === s);
const teamName = id => (data.teams.find(t => t.id === id) || {}).name || id;

// Pages: a subteam id, "calendar", or "meetings" (captains' tab, only while editing)
function currentPage() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id.split("/")[0] === "calendar") return "calendar";
  if (id === "meetings") return editing ? "meetings" : "calendar";
  return null;
}
function currentTeam() {
  const id = decodeURIComponent(location.hash.slice(1));
  return data.teams.find(t => t.id === id) || data.teams[0];
}

function navLink(href, label, count, current, cls) {
  const a = document.createElement("a");
  a.href = href;
  a.innerHTML = `<span></span><span class="n"></span>`;
  a.firstChild.textContent = label;
  a.lastChild.textContent = count || "";
  if (cls) a.className = cls;
  if (current) a.setAttribute("aria-current", "page");
  return a;
}

function render(focusId) {
  if (!data) return;
  document.body.classList.toggle("editing", editing);
  $("unlockBtn").hidden = editing;
  $("saveBtn").hidden = $("lockBtn").hidden = !editing;
  $("saveBtn").disabled = !dirty;
  $("hideDone").checked = hideDone;

  // Top-level text fields: anything with data-field is editable.
  document.querySelectorAll("[data-field]").forEach(el => {
    const k = el.dataset.field;
    el.textContent = data[k] ?? "";
    makeEditable(el, v => { data[k] = v; });
  });

  const page = currentPage();
  const team = page ? null : currentTeam();

  // Sidebar: calendar, captains' meetings tab (editing only), then one link per subteam
  const nav = $("nav");
  nav.innerHTML = "";
  const upcoming = data.meetings.filter(m => m.date >= iso(today())).length;
  nav.append(navLink("#calendar", "Calendar", "", page === "calendar"));
  if (editing) nav.append(navLink("#meetings", "Meeting dates", upcoming, page === "meetings", "hidden-tab"));
  nav.append(div("nav-sep"));
  data.teams.forEach(t => nav.append(navLink("#" + encodeURIComponent(t.id), t.name,
    data.tasks.filter(x => x.team === t.id && !x.done).length, team && t.id === team.id)));
  const allOpen = data.tasks.filter(t => !t.done).length;
  $("overall").textContent = `${allOpen} open across all subteams`;

  const label = page === "calendar" ? "Calendar" : page === "meetings" ? "Meeting dates" : team.name;
  $("mtopTitle").textContent = label;
  document.title = `${label} · ${data.title || "Tasks"}`;
  $("tools").hidden = !!page;
  $("footer").textContent = data.updated ? `Last saved ${new Date(data.updated).toLocaleString()}` : "";

  if (page === "calendar") return renderCalendar();
  if (page === "meetings") return renderMeetings();

  // Page for the selected subteam
  const mine = data.tasks.filter(t => t.team === team.id);
  const openTasks = sortTasks(mine.filter(t => !t.done));
  const doneTasks = sortTasks(mine.filter(t => t.done));

  const head = div("page-head");
  const h2 = document.createElement("h2"); h2.className = "page-title"; h2.textContent = team.name;
  makeEditable(h2, v => team.name = v);
  const meta = div("page-meta");
  meta.innerHTML = `<span><b></b> open</span><span></span>`;
  meta.querySelector("b").textContent = openTasks.length;
  meta.lastChild.textContent = mine.length ? `${doneTasks.length} of ${mine.length} done` : "No tasks yet";
  const track = div("track"); const fill = div("fill"); track.append(fill);
  head.append(h2, meta, track);
  const next = data.meetings.filter(m => m.date >= iso(today())).sort((a, b) => a.date.localeCompare(b.date))
    .find(m => (m.active || []).includes(team.id));
  if (next) {
    const n = div("muted", `Next active meeting: ${niceDate(next.date)}${next.note ? `, ${next.note}` : ""}`);
    n.style.marginTop = "10px";
    head.append(n);
  }
  $("pageHead").replaceChildren(head);
  requestAnimationFrame(() => { fill.style.width = mine.length ? (doneTasks.length / mine.length * 100) + "%" : "0"; });

  const list = $("list");
  list.innerHTML = "";
  const tl = div("team-list");
  if (!openTasks.length) tl.append(div("empty", editing ? "Nothing open. Add a task below." : "Nothing open."));
  openTasks.forEach(t => tl.append(taskEl(t)));
  if (doneTasks.length && !hideDone) {
    tl.append(div("donehead", `Done (${doneTasks.length})`));
    doneTasks.forEach(t => tl.append(taskEl(t)));
  }
  list.append(tl);
  if (editing) {
    const add = document.createElement("button");
    add.className = "addrow"; add.textContent = "Add task";
    add.onclick = () => addTask(team.id);
    list.append(add);
  }

  if (focusId) {
    const el = list.querySelector(`[data-id="${CSS.escape(focusId)}"] .title`);
    if (el) { el.focus(); document.getSelection().selectAllChildren(el); }
  }
}

/* ---------- Calendar: month, week and day views ----------
   The view lives in the URL (#calendar/week/2026-10-22) so links and the back button work. */
function calState() {
  const [, v, d] = decodeURIComponent(location.hash.slice(1)).split("/");
  return {
    view: ["month", "week", "day"].includes(v) ? v : "month",
    date: /^\d{4}-\d{2}-\d{2}$/.test(d || "") && parseDate(d) ? d : iso(today())
  };
}
const calHref = (view, date) => `#calendar/${view}/${date}`;
const goCal = (view, date) => { location.hash = calHref(view, date); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const openCount = id => data.tasks.filter(t => t.team === id && !t.done).length;

// A subteam box: links to that subteam's to-do list
function sbox(id, cls = "") {
  const a = document.createElement("a");
  a.className = "sbox " + cls;
  a.href = "#" + encodeURIComponent(id);
  a.textContent = teamName(id);
  a.title = `Open ${teamName(id)} tasks`;
  a.onclick = e => e.stopPropagation();
  return a;
}
const activeOf = m => m ? (m.active || []).filter(id => data.teams.some(t => t.id === id)) : [];

function renderCalendar() {
  const { view, date } = calState();
  const D = parseDate(date), t0 = iso(today());

  const head = div("page-head");
  const h2 = document.createElement("h2"); h2.className = "page-title"; h2.textContent = "Calendar";
  head.append(h2);
  $("pageHead").replaceChildren(head);

  const list = $("list");
  list.innerHTML = "";

  // Toolbar: previous / label / next, view switch, today
  const bar = div("cal-bar");
  const step = { month: d => new Date(d.getFullYear(), d.getMonth() + 1, 1), week: d => addDays(d, 7), day: d => addDays(d, 1) }[view];
  const back = { month: d => new Date(d.getFullYear(), d.getMonth() - 1, 1), week: d => addDays(d, -7), day: d => addDays(d, -1) }[view];
  const wkStart = addDays(D, -D.getDay()), wkEnd = addDays(wkStart, 6);
  const label = view === "month" ? D.toLocaleDateString(undefined, { month: "long", year: "numeric" })
    : view === "week" ? `${wkStart.toLocaleDateString(undefined, { month: "short", day: "numeric" })} to ${wkEnd.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`
    : D.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const prev = document.createElement("button"); prev.textContent = "‹"; prev.setAttribute("aria-label", "Previous");
  const next = document.createElement("button"); next.textContent = "›"; next.setAttribute("aria-label", "Next");
  prev.onclick = () => goCal(view, iso(back(D)));
  next.onclick = () => goCal(view, iso(step(D)));
  const seg = div("seg");
  ["month", "week", "day"].forEach(v => {
    const a = document.createElement("a");
    a.href = calHref(v, date); a.textContent = v[0].toUpperCase() + v.slice(1);
    if (v === view) a.setAttribute("aria-current", "true");
    seg.append(a);
  });
  const todayB = document.createElement("button"); todayB.textContent = "Today";
  todayB.onclick = () => goCal(view, t0);
  bar.append(prev, div("month", label), next, div("spacer"), seg, todayB);
  list.append(bar);

  if (view === "month") list.append(monthView(D, date, t0));
  else if (view === "week") list.append(weekView(wkStart, date, t0));
  else list.append(dayView(date, t0));
}

function monthView(D, sel, t0) {
  const y = D.getFullYear(), mo = D.getMonth();
  const first = new Date(y, mo, 1);
  const wrap = div("");
  const inMonth = data.meetings.filter(m => { const d = parseDate(m.date); return d.getFullYear() === y && d.getMonth() === mo; });
  wrap.append(div("muted cal-sub", inMonth.length
    ? `${inMonth.length} meeting${inMonth.length === 1 ? "" : "s"} this month. Tap a day to zoom into its week.`
    : "No meetings scheduled this month."));
  const grid = div("cal");
  WEEKDAYS.forEach(w => grid.append(div("dow", w)));
  const start = addDays(first, -first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, mo + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), ds = iso(d), m = meetingOn(ds), act = activeOf(m);
    const due = data.tasks.filter(t => t.due === ds && !t.done);
    const cell = div("day" + (d.getMonth() !== mo ? " out" : "") + (ds === t0 ? " today" : "") + (m ? " meet" : ""));
    cell.tabIndex = 0; cell.setAttribute("role", "link");
    cell.setAttribute("aria-label", `${d.toDateString()}${m ? ", meeting" : ""}. Open week`);
    cell.onclick = () => goCal("week", ds);
    cell.onkeydown = e => { if (e.key === "Enter") goCal("week", ds); };
    cell.append(div("num", d.getDate()));
    if (m && !act.length) cell.append(div("m txt", "Meeting"));
    const boxes = div("boxes txt");
    act.slice(0, 3).forEach(id => boxes.append(sbox(id)));
    if (act.length > 3) {
      const more = document.createElement("a"); more.className = "sbox more"; more.href = calHref("day", ds);
      more.textContent = `+${act.length - 3} more`; more.onclick = e => e.stopPropagation();
      boxes.append(more);
    }
    if (act.length) cell.append(boxes);
    if (due.length) cell.append(div("due txt" + (ds < t0 ? " over" : ""), `${due.length} due`));
    grid.append(cell);
  }
  wrap.append(grid);
  return wrap;
}

function weekView(start, sel, t0) {
  const wrap = div("");
  wrap.append(div("muted cal-sub", "Tap a day to zoom in. Tap a subteam to open its to-do list."));
  const grid = div("week");
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), ds = iso(d), m = meetingOn(ds), act = activeOf(m);
    const due = sortTasks(data.tasks.filter(t => t.due === ds && !t.done));
    const col = div("wk" + (ds === t0 ? " today" : "") + (m ? " meet" : "") + (ds === sel ? " sel" : ""));
    col.tabIndex = 0; col.setAttribute("role", "link");
    col.setAttribute("aria-label", `${d.toDateString()}. Open day`);
    col.onclick = () => goCal("day", ds);
    col.onkeydown = e => { if (e.key === "Enter") goCal("day", ds); };
    const hd = div("wk-head");
    hd.append(div("wk-dow", WEEKDAYS[d.getDay()]), div("wk-num", d.getDate()));
    col.append(hd);
    if (m) {
      col.append(div("wk-note", m.note || "Meeting"));
      const boxes = div("boxes");
      act.forEach(id => boxes.append(sbox(id)));
      if (!act.length) boxes.append(div("muted small", "No subteams yet"));
      col.append(boxes);
    } else {
      col.append(div("muted small", "No meeting"));
    }
    if (due.length) {
      const dl = div("wk-due");
      due.forEach(t => {
        const a = document.createElement("a"); a.href = "#" + encodeURIComponent(t.team);
        a.textContent = t.title; a.onclick = e => e.stopPropagation();
        a.className = ds < t0 ? "over" : "";
        dl.append(a);
      });
      col.append(dl);
    }
    grid.append(col);
  }
  wrap.append(grid);
  return wrap;
}

function dayView(ds, t0) {
  const box = div("detail");
  const m = meetingOn(ds);
  const act = activeOf(m);

  if (m) {
    const note = div("note", m.note || "Meeting");
    makeEditable(note, v => m.note = v);
    box.append(note);

    const h4 = document.createElement("h4"); h4.textContent = "Active subteams";
    box.append(h4);
    const boxes = div("boxes lg");
    act.forEach(id => {
      const a = sbox(id, "lg");
      const n = openCount(id);
      const sm = document.createElement("small"); sm.textContent = n ? `${n} open` : "Nothing open";
      a.append(sm);
      boxes.append(a);
    });
    if (!act.length) boxes.append(div("muted", "No subteams have marked themselves active yet."));
    box.append(boxes);

    if (editing) {
      const h5 = document.createElement("h4"); h5.textContent = "Mark subteams active (tap to toggle)";
      const g = div("teams-grid");
      const active = m.active || (m.active = []);
      data.teams.forEach(t => {
        const b = document.createElement("button");
        const on = active.includes(t.id);
        b.className = "tchip" + (on ? " on" : "");
        b.textContent = t.name;
        b.setAttribute("aria-pressed", on);
        b.onclick = () => {
          const i = active.indexOf(t.id);
          i >= 0 ? active.splice(i, 1) : active.push(t.id);
          active.sort((a, b) => data.teams.findIndex(x => x.id === a) - data.teams.findIndex(x => x.id === b));
          markDirty(); render();
        };
        g.append(b);
      });
      box.append(h5, g);
    }
  } else {
    box.append(div("muted", "No meeting scheduled."));
    if (editing) {
      const add = document.createElement("button"); add.className = "tbtn"; add.textContent = "Add a meeting on this day";
      add.style.marginTop = "10px";
      add.onclick = () => { addMeeting(ds, ""); markDirty(); render(); };
      box.append(add);
    }
  }

  const due = sortTasks(data.tasks.filter(t => t.due === ds && !t.done));
  if (due.length) {
    const h4 = document.createElement("h4"); h4.textContent = "Tasks due";
    const dl = div("due-list");
    due.forEach(t => {
      const row = document.createElement("div");
      const a = document.createElement("a"); a.href = "#" + encodeURIComponent(t.team); a.textContent = t.title;
      row.append(a, ` (${teamName(t.team)})`);
      dl.append(row);
    });
    box.append(h4, dl);
  }
  const wrap = div("");
  wrap.append(box);
  return wrap;
}

/* ---------- Meeting dates (captains, edit mode only) ---------- */
function addMeeting(date, note) {
  if (!date || meetingOn(date)) return false;
  data.meetings.push({ date, note: note || "", active: [] });
  data.meetings.sort((a, b) => a.date.localeCompare(b.date));
  return true;
}

function renderMeetings() {
  const head = div("page-head");
  const h2 = document.createElement("h2"); h2.className = "page-title"; h2.textContent = "Meeting dates";
  const sub = div("muted", "Only shown while editing. Leads mark their subteam active on each date from the Calendar.");
  sub.style.marginTop = "8px";
  head.append(h2, sub);
  $("pageHead").replaceChildren(head);

  const list = $("list");
  list.innerHTML = "";

  // Add one date
  const one = div("section");
  const h1 = document.createElement("h4"); h1.className = "donehead"; h1.textContent = "Add a meeting";
  const r1 = div("form-row");
  r1.innerHTML = `<label>Date<input type="date" id="mDate"></label>
    <label>Note<input type="text" id="mNote" placeholder="e.g. 3:30 to 6 pm"></label>
    <button class="tbtn go" id="mAdd">Add meeting</button>`;
  one.append(h1, r1);

  // Add a repeating schedule
  const rep = div("section");
  const h2r = document.createElement("h4"); h2r.className = "donehead"; h2r.textContent = "Add a weekly schedule";
  const r2 = div("form-row");
  r2.innerHTML = `<label>From<input type="date" id="rFrom"></label>
    <label>To<input type="date" id="rTo"></label>
    <label>Note<input type="text" id="rNote" placeholder="e.g. 3:30 to 6 pm"></label>`;
  const wd = div("wd");
  WEEKDAYS.forEach((w, i) => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" value="${i}"> ${w}`;
    wd.append(l);
  });
  const r3 = div("form-row"); r3.style.marginTop = "8px";
  r3.append(wd);
  const addRep = document.createElement("button"); addRep.className = "tbtn go"; addRep.textContent = "Add meetings";
  r3.append(addRep);
  rep.append(h2r, r2, r3);

  list.append(one, rep);

  $("mAdd").onclick = () => {
    const d = $("mDate").value;
    if (!d) return setStatus("Pick a date first.", "err");
    if (!addMeeting(d, $("mNote").value.trim())) return setStatus("There's already a meeting on that date.", "err");
    markDirty(); render(); setStatus(`Added ${niceDate(d)}. Save to publish it.`);
  };
  addRep.onclick = () => {
    const from = parseDate($("rFrom").value), to = parseDate($("rTo").value);
    const days = [...wd.querySelectorAll("input:checked")].map(i => +i.value);
    if (!from || !to || to < from) return setStatus("Pick a start date and a later end date.", "err");
    if (!days.length) return setStatus("Pick at least one weekday.", "err");
    if ((to - from) / 86400000 > 366) return setStatus("Keep the range to a year or less.", "err");
    let n = 0;
    for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1))
      if (days.includes(d.getDay()) && addMeeting(iso(d), $("rNote").value.trim())) n++;
    markDirty(); render();
    setStatus(n ? `Added ${n} meeting${n === 1 ? "" : "s"}. Save to publish them.` : "No new dates. They were already scheduled.");
  };

  // Existing meetings
  const t = iso(today());
  const upcoming = data.meetings.filter(m => m.date >= t), past = data.meetings.filter(m => m.date < t);
  const sec = div("section");
  const h3 = document.createElement("h4"); h3.className = "donehead"; h3.textContent = `Upcoming (${upcoming.length})`;
  sec.append(h3);
  const ml = div("mlist");
  if (!upcoming.length) ml.append(div("muted", "No upcoming meetings."));
  upcoming.forEach(m => ml.append(meetingRow(m)));
  sec.append(ml);
  if (past.length) {
    const det = document.createElement("details");
    det.innerHTML = `<summary>Past meetings (${past.length})</summary>`;
    const pl = div("mlist");
    [...past].reverse().forEach(m => pl.append(meetingRow(m)));
    det.append(pl);
    sec.append(det);
  }
  list.append(sec);
}

function meetingRow(m) {
  const r = div("mrow");
  const d = div("d", niceDate(m.date, { weekday: "short", month: "short", day: "numeric" }));
  const note = div("note-cell", m.note || "");
  makeEditable(note, v => m.note = v);
  const n = (m.active || []).length;
  const c = div("c", n ? `${n} active` : "None active");
  const del = document.createElement("button");
  del.className = "del"; del.textContent = "×"; del.title = "Remove meeting"; del.setAttribute("aria-label", "Remove meeting");
  del.onclick = () => {
    if (n && !confirm(`${n} subteam${n === 1 ? " has" : "s have"} marked this meeting active. Remove it anyway?`)) return;
    data.meetings.splice(data.meetings.indexOf(m), 1); markDirty(); render();
  };
  r.append(d, note, c, del);
  return r;
}

function taskEl(t) {
  const el = document.createElement("div");
  el.className = `task p-${t.priority}` + (t.done ? " done" : "");
  el.dataset.id = t.id;

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.className = "check"; cb.checked = !!t.done; cb.disabled = !editing;
  cb.setAttribute("aria-label", "Done");
  cb.onchange = () => { t.done = cb.checked; markDirty(); render(); };

  const mid = document.createElement("div");
  const title = div("title", t.title);
  makeEditable(title, v => t.title = v);

  const meta = div("meta");
  if (editing) {
    const teamSel = document.createElement("select");
    teamSel.setAttribute("aria-label", "Subteam");
    data.teams.forEach(x => teamSel.add(new Option(x.name, x.id, false, x.id === t.team)));
    teamSel.onchange = () => {
      t.team = teamSel.value;
      const cats = teamOf(t).categories || [];
      if (!cats.includes(t.subsystem)) t.subsystem = cats.includes("Other") ? "Other" : (cats[0] || "");
      markDirty(); render();
    };
    meta.append(
      field("Owner", t.owner, v => t.owner = v),
      teamSel,
      selectField(t.subsystem, teamOf(t).categories || [], v => { t.subsystem = v; }),
      dateField(t.due, v => t.due = v)
    );
  } else {
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = t.subsystem;
    const who = document.createElement("span"); who.innerHTML = "<b></b>";
    who.firstChild.textContent = t.owner || "Unassigned";
    const due = dueInfo(t);
    const ds = document.createElement("span"); ds.className = "due " + due.cls; ds.textContent = due.text;
    meta.append(tag, who, ds);
  }

  const notes = div("notes", t.notes || "");
  makeEditable(notes, v => t.notes = v);
  if (!editing && !t.notes) notes.hidden = true;
  mid.append(title, meta, notes);

  const right = div("right");
  if (editing) {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Priority");
    PRIORITIES.forEach(p => sel.add(new Option(p, p, false, p === t.priority)));
    sel.onchange = () => { t.priority = sel.value; markDirty(); render(); };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.title = "Delete task"; del.setAttribute("aria-label", "Delete task");
    del.onclick = () => { data.tasks.splice(data.tasks.indexOf(t), 1); markDirty(); render(); };
    right.append(sel, del);
  } else {
    const p = document.createElement("span");
    p.className = "pri"; p.textContent = t.priority;
    right.append(p);
  }

  el.append(cb, mid, right);
  return el;
}

function div(cls, text) { const d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }

function field(label, val, set) {
  const s = document.createElement("span");
  const b = document.createElement("b"); b.textContent = val || "";
  b.dataset.placeholder = "Unassigned";
  makeEditable(b, v => set(v));
  s.append(label + " ", b);
  return s;
}

function selectField(val, opts, set) {
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", "Category");
  const all = opts.includes(val) || !val ? opts : [val, ...opts];
  all.forEach(o => sel.add(new Option(o, o, false, o === val)));
  sel.onchange = () => { set(sel.value); markDirty(); };
  return sel;
}

function dateField(val, set) {
  const inp = document.createElement("input"); inp.type = "date"; inp.value = val || "";
  inp.setAttribute("aria-label", "Due date");
  inp.onchange = () => { set(inp.value); markDirty(); };
  return inp;
}

function makeEditable(el, set) {
  el.contentEditable = editing ? "true" : "false";
  if (!editing) return;
  if (!el.textContent) el.style.minWidth = "3em";
  el.oninput = () => { set(el.textContent.trim()); markDirty(); };
  el.onkeydown = e => { if (e.key === "Enter" && !el.classList.contains("notes")) { e.preventDefault(); el.blur(); } };
}

function addTask(teamId) {
  const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
  const team = data.teams.find(t => t.id === teamId) || data.teams[0];
  const cats = team.categories || [];
  data.tasks.push({
    id, team: team.id, title: "New task", owner: "",
    subsystem: cats.includes("Other") ? "Other" : (cats[0] || ""),
    priority: "High", due: "", done: false, notes: ""
  });
  markDirty(); render(id);
}

/* ---------- Wire up ---------- */
$("unlockBtn").onclick = unlock;
$("lockBtn").onclick = lock;
$("saveBtn").onclick = save;
$("showPw").onclick = () => {
  const i = $("tokenInput"); const show = i.type === "password";
  i.type = show ? "text" : "password"; $("showPw").textContent = show ? "Hide" : "Show"; i.focus();
};
function setMenu(open) {
  $("side").classList.toggle("open", open); $("scrim").classList.toggle("open", open);
  $("menuBtn").setAttribute("aria-expanded", open);
}
$("menuBtn").onclick = () => setMenu(!$("side").classList.contains("open"));
$("scrim").onclick = () => setMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
window.addEventListener("hashchange", () => { setMenu(false); render(); window.scrollTo(0, 0); });
$("hideDone").onchange = e => {
  hideDone = e.target.checked;
  try { localStorage.setItem(HIDE_KEY, hideDone ? "1" : "0"); } catch {}
  render();
};
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s" && editing) { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => { if (token && await tryToken(token, false)) return; await load(); })();
</script>
</body>
</html>
